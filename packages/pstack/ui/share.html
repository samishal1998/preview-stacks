<!doctype html>
<!--
  The public, read-only view one share link opens: /deployments/<id>/public-logs-view?token=…

  Served by the API for every host (the advanced SPA renders its own richer version of the same
  route). Self-contained on purpose: the viewer has no account, no session and no access to anything
  but the routes the token allows, so nothing here may assume the control UI's assets or state.

  The token travels in the query string and is attached to every request the page makes, including
  the EventSource that follows logs — a browser cannot put a header on one, which is the reason the
  API accepts ?token= at all (share.ts).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pstack · shared deployment</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #0f1115; color: #e6e8ee; }
  header { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; align-items: baseline; padding: 1rem 1.25rem; border-bottom: 1px solid #232834; }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  header .muted, .muted { color: #8b93a7; }
  .badge { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .8rem; border: 1px solid #2f3542; }
  .badge.running { color: #9ece6a; border-color: #3d5a2a; }
  .badge.asleep { color: #e0af68; border-color: #5a4a2a; }
  .badge.off { color: #8b93a7; }
  main { display: grid; gap: 1rem; padding: 1rem 1.25rem; max-width: 1400px; }
  section { border: 1px solid #232834; border-radius: 8px; background: #141821; }
  section > h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: #8b93a7; margin: 0; padding: .6rem .9rem; border-bottom: 1px solid #232834; display: flex; gap: .75rem; align-items: center; }
  section > h2 .spacer { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: .45rem .9rem; border-top: 1px solid #1c212c; vertical-align: top; }
  th { color: #8b93a7; font-weight: 500; font-size: .8rem; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
  pre#log { margin: 0; padding: .75rem .9rem; max-height: 70vh; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  pre#log .e { color: #f7768e; }
  select, button, label { font: inherit; color: inherit; }
  select, button { background: #1b2030; border: 1px solid #2f3542; border-radius: 6px; padding: .2rem .5rem; }
  button[aria-pressed="true"] { border-color: #7aa2f7; color: #7aa2f7; }
  .error { padding: 1rem 1.25rem; color: #f7768e; }
  .empty { padding: .75rem .9rem; color: #8b93a7; }
</style>
</head>
<body>
<header>
  <h1 id="title">Shared deployment</h1>
  <span id="state" class="badge off">…</span>
  <span class="muted" id="expiry"></span>
  <span class="muted">read-only · pstack</span>
</header>
<div id="error" class="error" hidden></div>
<main id="main" hidden>
  <section id="details" hidden>
    <h2>Details</h2>
    <table><tbody id="kv"></tbody></table>
    <table id="containers"><thead><tr><th>Service</th><th>Container</th><th>State</th><th>Health</th><th>Node</th></tr></thead><tbody></tbody></table>
    <div id="noContainers" class="empty" hidden>Nothing is running.</div>
  </section>
  <section id="logs" hidden>
    <h2>Logs
      <span class="spacer"></span>
      <select id="service"><option value="">all services</option></select>
      <button id="ts" aria-pressed="false" title="show timestamps">timestamps</button>
      <button id="follow" aria-pressed="true" title="keep following">following</button>
    </h2>
    <pre id="log"></pre>
  </section>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var token = q.get('token') || '';
  var m = /^\/deployments\/([^/]+)\/public-logs-view\/?$/.exec(location.pathname);
  var id = m ? decodeURIComponent(m[1]) : '';
  var $ = function (s) { return document.querySelector(s); };
  function fail(msg) { $('#error').hidden = false; $('#error').textContent = msg; $('#main').hidden = true; }
  if (!id || !token) { fail('This link is incomplete — it needs a deployment and a token.'); return; }

  function api(path, params) {
    var u = new URL(path, location.origin);
    u.searchParams.set('token', token);
    Object.keys(params || {}).forEach(function (k) { if (params[k] !== '' && params[k] != null) u.searchParams.set(k, params[k]); });
    return u.toString();
  }
  function get(path, params) {
    return fetch(api(path, params), { cache: 'no-store' }).then(function (r) {
      if (r.status === 401) throw new Error('This link has expired or is not valid.');
      if (r.status === 403) throw new Error('This link does not allow that view.');
      return r.json().then(function (b) { if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status)); return b; });
    });
  }

  var views = [];
  var es = null;
  var service = '';
  var timestamps = false;
  var following = true;

  function setState(text, cls) { var el = $('#state'); el.textContent = text; el.className = 'badge ' + cls; }

  function renderDetails(d, rt) {
    $('#details').hidden = false;
    var rows = [['Deployment', d.id], ['Stack', d.stack], ['Kind', d.kind], ['Orchestrator', d.orchestrator || 'compose'],
      ['Created', new Date(d.createdAt).toLocaleString()], ['Updated', new Date(d.updatedAt).toLocaleString()]];
    if (d.asleep) rows.push(['Asleep since', new Date(d.asleep.since).toLocaleString() + ' (' + d.asleep.reason + ')']);
    $('#kv').innerHTML = rows.map(function (r) { return '<tr><th>' + r[0] + '</th><td><code>' + esc(String(r[1])) + '</code></td></tr>'; }).join('');
    var tb = $('#containers tbody');
    var cs = (rt && rt.containers) || [];
    tb.innerHTML = cs.map(function (c) {
      return '<tr><td>' + esc(c.service || '—') + '</td><td><code>' + esc(c.name) + '</code></td><td>' + esc(c.state) + '</td><td>' + esc(c.health || '—') + '</td><td>' + esc(c.node || '—') + '</td></tr>';
    }).join('');
    $('#containers').hidden = cs.length === 0;
    $('#noContainers').hidden = cs.length !== 0;
    var sel = $('#service');
    var seen = {};
    cs.forEach(function (c) { if (c.service && !seen[c.service]) { seen[c.service] = 1; var o = document.createElement('option'); o.value = c.service; o.textContent = c.service; sel.appendChild(o); } });
    if (d.asleep) setState('asleep', 'asleep');
    else if (rt && rt.reachable === false) setState('unknown', 'off');
    else if (cs.some(function (c) { return c.state === 'running'; })) setState('running', 'running');
    else setState('not running', 'off');
  }

  function esc(s) { return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function line(text, level) {
    var log = $('#log');
    var atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    var span = document.createElement('span');
    if (level === 'error') span.className = 'e';
    span.textContent = text + '\n';
    log.appendChild(span);
    while (log.childNodes.length > 5000) log.removeChild(log.firstChild);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  function startLogs() {
    if (es) { es.close(); es = null; }
    $('#log').textContent = '';
    var params = { service: service, tail: 500, timestamps: timestamps ? '1' : '' };
    if (!following) {
      get('/api/deployments/' + encodeURIComponent(id) + '/logs', params)
        .then(function (b) { (b.text || '').split('\n').forEach(function (l) { if (l) line(l, 'info'); }); })
        .catch(function (e) { line('[' + e.message + ']', 'error'); });
      return;
    }
    es = new EventSource(api('/api/deployments/' + encodeURIComponent(id) + '/logs/stream', params));
    es.onmessage = function (ev) {
      var d = JSON.parse(ev.data);
      if (d.done) { line('[' + (d.reason || 'stream ended') + ']', 'error'); es.close(); es = null; return; }
      line(d.line, d.level);
    };
    es.onerror = function () { line('[stream disconnected — reload to reconnect]', 'error'); if (es) { es.close(); es = null; } };
  }

  $('#service').addEventListener('change', function (e) { service = e.target.value; startLogs(); });
  $('#ts').addEventListener('click', function () { timestamps = !timestamps; this.setAttribute('aria-pressed', String(timestamps)); startLogs(); });
  $('#follow').addEventListener('click', function () {
    following = !following; this.setAttribute('aria-pressed', String(following)); this.textContent = following ? 'following' : 'paused';
    if (!following && es) { es.close(); es = null; } else if (following) startLogs();
  });

  get('/api/auth/me').then(function (me) {
    if (!me.share) throw new Error('This link is not a share link.');
    views = me.share.views || [];
    $('#title').textContent = 'Shared deployment · ' + id;
    if (me.share.expiresAt) $('#expiry').textContent = 'link expires ' + new Date(me.share.expiresAt).toLocaleString();
    $('#main').hidden = false;
    var tasks = [];
    if (views.indexOf('details') !== -1) {
      tasks.push(Promise.all([
        get('/api/deployments/' + encodeURIComponent(id)),
        get('/api/deployments/' + encodeURIComponent(id) + '/runtime').catch(function () { return null; }),
      ]).then(function (r) { renderDetails(r[0], r[1]); }));
    } else {
      get('/api/deployments/' + encodeURIComponent(id) + '/runtime').then(function (rt) {
        var sel = $('#service'); var seen = {};
        (rt.containers || []).forEach(function (c) { if (c.service && !seen[c.service]) { seen[c.service] = 1; var o = document.createElement('option'); o.value = c.service; o.textContent = c.service; sel.appendChild(o); } });
      }).catch(function () {});
      setState('logs only', 'off');
    }
    if (views.indexOf('logs') !== -1) { $('#logs').hidden = false; startLogs(); }
    return Promise.all(tasks);
  }).catch(function (e) { fail(e.message); });
})();
</script>
</body>
</html>
