<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- An operations console for one host, and a page a search engine must never hold. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="pstack — the built-in console for this preview host: deployments, jobs and routing.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e1013">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230e1116'/%3E%3Crect%20x='7'%20y='7'%20width='18'%20height='4.6'%20rx='2.3'%20fill='%234a9dff'/%3E%3Crect%20x='7'%20y='13.7'%20width='18'%20height='4.6'%20rx='2.3'%20fill='%237c8798'/%3E%3Crect%20x='7'%20y='20.4'%20width='18'%20height='4.6'%20rx='2.3'%20fill='%2349525f'/%3E%3C/svg%3E">
<title>pstack</title>
<style>
  :root {
    --bg: #0e1013;
    --panel: #15181d;
    --panel-2: #1b1f26;
    --sunk: #0a0c0f;
    --line: #272d36;
    --fg: #e6e9ee;
    --fg-dim: #9aa4b2;
    --fg-mute: #6b7480;
    --ok: #3fb950;
    --fail: #f85149;
    --leak: #e3922a;
    --neutral: #8b949e;
    --accent: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  h2 { font-size: 12px; margin: 0 0 10px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .08em; }
  h3 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
  p { margin: 0 0 8px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono, pre { font-family: var(--mono); font-size: 12px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- shell: header across the top, nav down the left, view on the right ---------------- */
  #app { display: flex; flex-direction: column; min-height: 100%; }
  header {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .shell { display: grid; grid-template-columns: 186px minmax(0, 1fr); flex: 1; align-items: start; }
  nav { border-right: 1px solid var(--line); padding: 12px 10px; position: sticky; top: 0; }
  nav ul { list-style: none; margin: 0 0 14px; padding: 0; }
  nav a {
    display: flex; gap: 8px; align-items: baseline; justify-content: space-between;
    padding: 6px 9px; border-radius: 6px; color: var(--fg-dim);
  }
  nav a:hover { background: var(--panel-2); color: var(--fg); text-decoration: none; }
  nav a[aria-current=page] { background: var(--panel-2); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
  nav .n { font-family: var(--mono); font-size: 11px; color: var(--fg-mute); }
  nav .meta { border-top: 1px solid var(--line); padding: 10px 9px 0; font-size: 11px; color: var(--fg-mute); }
  nav .meta div { overflow-wrap: anywhere; margin-bottom: 3px; }
  .view { padding: 14px 16px 32px; min-width: 0; }

  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .two.wide-left { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
  @media (max-width: 1080px) { .two, .two.wide-left { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 14px; }
  .panel:last-child { margin-bottom: 0; }
  .panel.flat { background: none; }
  .phead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .phead h2 { margin: 0; }
  .crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }

  /* ---- controls -------------------------------------------------------------------------- */
  input[type=text], input[type=password], input[type=number], select, textarea {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit; min-width: 0; max-width: 100%;
  }
  textarea { width: 100%; font-family: var(--mono); font-size: 12px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  button {
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--fg-mute); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { border-color: #2d5a8e; background: #16324f; }
  button.danger { border-color: #6b2b28; background: #3d1c1a; }
  button.link { background: none; border: 0; color: var(--accent); padding: 4px 6px; }
  button.small { padding: 3px 8px; font-size: 12px; }
  label { color: var(--fg-dim); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stretch { flex: 1; }
  .grow { flex: 1; }
  .muted { color: var(--fg-mute); }
  .dim { color: var(--fg-dim); }
  .err { color: var(--fail); }
  .nowrap { white-space: nowrap; }
  /* `anywhere`, not `break-all`: a long id or compose path must not widen the page, but a value
     that fits should never be chopped mid-word. */
  .name { font-family: var(--mono); overflow-wrap: anywhere; }
  .hint { color: var(--fg-mute); font-size: 12px; margin: 6px 0 0; }

  /* ---- tabs ------------------------------------------------------------------------------ */
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs a {
    padding: 7px 12px; color: var(--fg-dim); border-bottom: 2px solid transparent;
    border-radius: 0; font-size: 13px;
  }
  .tabs a:hover { color: var(--fg); text-decoration: none; }
  .tabs a[aria-current=page] { color: var(--fg); border-bottom-color: var(--accent); }
  .tabs .n { font-family: var(--mono); font-size: 11px; color: var(--fg-mute); }

  /* ---- badges ---------------------------------------------------------------------------- */
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px;
    border: 1px solid var(--line); color: var(--fg-dim); font-family: var(--mono); white-space: nowrap;
  }
  .badge.busy, .badge.running { color: var(--accent); border-color: #2d5a8e; }
  .badge.ok { color: var(--ok); border-color: #1f4a29; }
  .badge.failed { color: var(--fail); border-color: #6b2b28; }
  .badge.warn { color: var(--leak); border-color: #6d4a15; }
  /* leaked is FILLED, not outlined. It is the one outcome this whole tool exists to surface, and it
     must not be mistakable for `failed` (red) or `ok` (green) at a glance. */
  .badge.leaked { color: #2a1e08; background: var(--leak); border-color: var(--leak); font-weight: 600; }
  .badge.unknown { color: var(--fg-mute); border-style: dashed; }
  /* asleep is its own state — not running, not torn down — so it gets its own colour. */
  .badge.asleep { color: #c4a7e7; border-color: #4e3a66; }
  /*
   * The kind badge is the most consequential glance on the list: `down` on a shared deployment
   * destroys volumes every tenant depends on. Amber = handle with care, and it is filled rather
   * than outlined so it reads differently from every other badge at a glance.
   */
  .badge.k-shared { color: #2a1e08; background: var(--leak); border-color: var(--leak); font-weight: 600; }
  .badge.k-isolated { color: var(--accent); border-color: #2d5a8e; }

  /* ---- lists & tables -------------------------------------------------------------------- */
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { padding: 7px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  ul.list li:last-child { border-bottom: 0; }
  .scroll-x { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--fg-mute); font-weight: 500; padding: 4px 10px 4px 0; white-space: nowrap;
  }
  td { padding: 6px 10px 6px 0; border-top: 1px solid var(--line); vertical-align: top; font-size: 13px; }
  tbody tr:hover td { background: var(--panel-2); }
  td.mark { width: 1.4em; font-family: var(--mono); text-align: center; }
  .s-ok { color: var(--ok); }
  .s-failed { color: var(--fail); }
  .s-leaked { color: var(--leak); font-weight: 600; }
  .s-unverifiable { color: var(--neutral); }

  /* ---- stat tiles ------------------------------------------------------------------------ */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .stat .v { font-size: 20px; font-family: var(--mono); line-height: 1.2; }
  .stat .k { font-size: 11px; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .05em; }
  .stat.unknown .v { color: var(--fg-mute); }

  /* ---- log pane -------------------------------------------------------------------------- */
  pre.log {
    margin: 0; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; height: 380px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  pre.log.short { height: 240px; }
  .log .t { color: var(--fg-mute); }
  .lv-step { color: var(--accent); }
  .lv-warn { color: var(--leak); }
  .lv-error { color: var(--fail); }

  /* ---- banners --------------------------------------------------------------------------- */
  .banner { border-radius: 6px; padding: 9px 11px; border: 1px solid var(--line); margin-bottom: 12px; }
  .banner:last-child { margin-bottom: 0; }
  .banner.leaked { border-color: #6d4a15; background: #2a1e08; color: #f0c078; }
  .banner.warn { border-color: #6d4a15; background: #2a1e08; color: #f0c078; }
  .banner.failed { border-color: #6b2b28; background: #2c1513; color: #ffa198; }
  .banner.ok { border-color: #1f4a29; background: #0f2415; color: #7ee18a; }
  .banner.info { border-color: #2d5a8e; background: #10243a; color: #a3cfff; }
  .banner.plain { background: var(--panel-2); color: var(--fg-dim); }
  .banner b { font-family: var(--mono); }
  .banner code { background: rgba(0,0,0,.3); padding: 0 4px; border-radius: 3px; }
  .banner a { color: inherit; text-decoration: underline; }
  .banner ul { margin: 6px 0 0; padding-left: 20px; }

  /* A SpecError is the tool's main teaching surface: multi-line, indented, meant to be read. */
  pre.spec-error {
    margin: 10px 0 0; background: #2c1513; border: 1px solid #6b2b28; color: #ffa198;
    border-radius: 6px; padding: 10px; white-space: pre-wrap; word-break: break-word;
    max-height: 340px; overflow: auto;
  }
  pre.text-out {
    margin: 0; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; max-height: 460px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }

  /* ---- key/value editor ------------------------------------------------------------------ */
  .kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 6px; margin-bottom: 6px; }
  .kv-head { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-mute); }
  .masked { color: var(--fg-mute); letter-spacing: .12em; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ================================ header ================================ -->
  <header>
    <h1>pstack</h1>
    <span class="badge" v-if="health.version">v{{ health.version }}</span>
    <span class="grow"></span>

    <!--
      Two ways in, mirroring the API's principals: a bearer token, or a username/password session.
      The session sets an httpOnly cookie, which fetch and EventSource attach automatically — so
      after signing in, the token field can stay empty.
    -->
    <template v-if="health.authEnforced === true && !token && !me">
      <!--
        The operator's own identity provider, when one is configured. A full NAVIGATION, not a
        fetch: the point is to leave this origin for their consent screen, and to come back to
        /api/auth/sso/callback with a session cookie already set.
      -->
      <button v-if="health.sso && health.sso.enabled" @click="signInWithProvider">
        sign in with {{ health.sso.label }}
      </button>
      <input type="text" v-model.trim="loginUser" placeholder="username"
             autocomplete="username" style="width:110px">
      <input type="password" v-model="loginPass" placeholder="password"
             autocomplete="current-password" style="width:110px" @keyup.enter="signIn">
      <button @click="signIn" :disabled="!loginUser || !loginPass">sign in</button>
      <span v-if="loginError" class="badge warn">{{ loginError }}</span>
      <!-- The provider refused, or the exchange failed. Its own words, carried in the query string
           because the callback answers with a redirect and there is no body to read. -->
      <span v-if="ssoError" class="badge warn">{{ ssoError }}</span>
    </template>
    <span v-else-if="me && me.user" class="muted nowrap">{{ me.user.username }}
      <button class="ghost" @click="signOut">sign out</button></span>

    <label for="tok">token</label>
    <input id="tok" type="password" v-model.trim="token" placeholder="bearer token"
           autocomplete="off" style="width:150px">
    <!--
      When no token is configured the server binds 127.0.0.1 and refuses 0.0.0.0 (cli.ts), so
      "not enforced" is a deliberate loopback-only mode, not an accident.
    -->
    <span v-if="health.authEnforced === false" class="muted nowrap">
      auth not enforced &mdash; loopback-only
    </span>
    <span v-else-if="health.authEnforced === true && !token && !me" class="badge warn">sign in or set a token</span>
  </header>

  <div class="shell">
    <!-- ================================ nav ================================ -->
    <nav aria-label="Sections">
      <ul>
        <li><a href="#/" :aria-current="route.view === 'overview' ? 'page' : null">Overview</a></li>
        <li>
          <a href="#/deployments" :aria-current="['list','detail'].includes(route.view) ? 'page' : null">
            Deployments <span class="n">{{ deployments.length }}</span>
          </a>
        </li>
        <li><a href="#/submit" :aria-current="route.view === 'submit' ? 'page' : null">Submit</a></li>
        <li>
          <a href="#/jobs" :aria-current="['jobs','job'].includes(route.view) ? 'page' : null">
            Jobs <span class="n">{{ jobs.length }}</span>
          </a>
        </li>
        <li><a href="#/swarm" :aria-current="route.view === 'swarm' ? 'page' : null">Swarm</a></li>
      </ul>
      <div class="meta">
        <div v-if="health.dataDir">data <span class="mono">{{ health.dataDir }}</span></div>
        <div v-if="control.project">control <span class="mono">{{ control.project }}</span></div>
        <div v-if="healthError" class="err">{{ healthError }}</div>
      </div>
    </nav>

    <main class="view">

      <!-- ============================== overview ============================== -->
      <template v-if="route.view === 'overview'">
        <div class="two wide-left">

          <!-- ---- control stack: read-only, on purpose ---- -->
          <div>
            <div class="panel">
              <div class="phead">
                <h2>Control stack</h2>
                <span class="badge" v-if="control.project">{{ control.project }}</span>
                <span class="grow"></span>
                <button class="small" @click="loadControl">Refresh</button>
              </div>

              <p v-if="controlError" class="err">{{ controlError }}</p>

              <template v-else-if="controlLoaded">
                <!--
                  Three distinct failure shapes, and collapsing any of them into "nothing running"
                  would be a lie an operator acts on:
                    reachable:false  docker did not answer — we know NOTHING about the stack
                    parseError       docker answered, we could not read it
                    services: []     docker answered clearly: no containers
                -->
                <div v-if="!control.reachable" class="banner warn">
                  <b>docker did not answer.</b> This is <em>not</em> the same as &ldquo;nothing is
                  running&rdquo; &mdash; the control stack may be perfectly healthy while this
                  process cannot reach the socket. Check the daemon and the socket mount, then
                  refresh.
                </div>
                <div v-else-if="control.parseError" class="banner warn">
                  <b>docker answered, but the output could not be parsed.</b> Service state is
                  unknown for this refresh; the stack itself may be fine.
                </div>
                <div v-else-if="!control.services.length" class="banner failed">
                  <b>no containers in this project.</b> docker answered clearly, so the control
                  stack really is down &mdash; yet you are reading this page, which it serves.
                  You are most likely reaching the API by some other route.
                </div>

                <div class="scroll-x" v-if="control.services.length">
                  <table>
                    <thead><tr><th>service</th><th>state</th><th>health</th><th>image</th></tr></thead>
                    <tbody>
                      <tr v-for="s in control.services" :key="s.name">
                        <td class="name">{{ s.name }}</td>
                        <td :class="s.state === 'running' ? 's-ok' : 's-failed'">{{ s.state || '—' }}</td>
                        <td :class="s.health === 'healthy' ? 's-ok' : (s.health ? 's-failed' : '')">
                          {{ s.health || '—' }}
                        </td>
                        <td class="name dim">{{ s.image || '—' }}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!--
                  This sits exactly where an operator's eye goes looking for up/down/verify buttons,
                  because the answer to "where are they" is the important part: the API serving this
                  page runs INSIDE this stack. `up` here would kill the process performing it, and a
                  failed self-upgrade leaves the host with no control plane and no remote way in.
                  The server states `actionable: false` in the payload for this reason. Never add an
                  action here, even a "safe" one.
                -->
                <div class="banner plain" style="margin-top:12px">
                  <b>Read-only &mdash; there are no actions here.</b>
                  <p style="margin:6px 0 0">{{ control.note || defaultControlNote }}</p>
                  <p class="muted" style="margin:6px 0 0" v-if="control.managedBy">
                    Managed by <code>{{ control.managedBy }}</code>.
                  </p>
                </div>
              </template>
              <p v-else class="muted">loading…</p>
            </div>
          </div>

          <!-- ---- deployment summary + recent jobs ---- -->
          <div>
            <div class="panel">
              <div class="phead">
                <h2>Deployments</h2>
                <span class="grow"></span>
                <a href="#/deployments">all &rarr;</a>
              </div>
              <p v-if="listError" class="err">{{ listError }}</p>
              <div class="stats" v-else>
                <div class="stat"><div class="v">{{ summary.total }}</div><div class="k">total</div></div>
                <div class="stat"><div class="v">{{ summary.isolated }}</div><div class="k">isolated</div></div>
                <div class="stat"><div class="v">{{ summary.shared }}</div><div class="k">shared</div></div>
                <div class="stat"><div class="v">{{ summary.running }}</div><div class="k">running</div></div>
                <div class="stat"><div class="v">{{ summary.busy }}</div><div class="k">busy</div></div>
                <!--
                  The server sends `null`, never `false`, when it could not determine busy/running.
                  An unknown must never be counted as a zero: that is how a live stack gets reported
                  as torn down. It gets its own tile.
                -->
                <div class="stat unknown" v-if="summary.unknown">
                  <div class="v">{{ summary.unknown }}</div><div class="k">unknown</div>
                </div>
              </div>
              <p class="hint" v-if="summary.unresolved">
                {{ summary.unresolved }} deployment(s) could not be resolved in this listing &mdash;
                their spec needs <code>${VAR}</code> values. Open one and set its variables.
              </p>
              <p class="hint" v-else-if="summary.unknown">
                &ldquo;unknown&rdquo; means the server could not determine <code>busy</code> or
                <code>running</code> for that row, not that it is idle.
              </p>
            </div>

            <div class="panel">
              <div class="phead">
                <h2>Recent jobs</h2>
                <span class="grow"></span>
                <a href="#/jobs">all &rarr;</a>
              </div>
              <p v-if="jobsError" class="err">{{ jobsError }}</p>
              <ul class="list" v-else>
                <li v-for="j in jobs.slice(0, 7)" :key="j.id">
                  <span class="badge" :class="j.state">{{ j.state }}</span>
                  <a class="name stretch" :href="'#/jobs/' + encodeURIComponent(j.id)">
                    {{ j.action }} {{ j.stack }}
                  </a>
                  <span class="mono muted nowrap">{{ stamp(j.startedAt) }}</span>
                </li>
                <li v-if="!jobs.length" class="muted">
                  no jobs yet &mdash; jobs are held in memory, so a server restart clears the history
                </li>
              </ul>
            </div>
          </div>
        </div>
      </template>

      <!-- ============================== deployments list ============================== -->
      <template v-else-if="route.view === 'list'">
        <div class="panel">
          <div class="phead">
            <h2>Deployments</h2>
            <span class="grow"></span>
            <button class="small" @click="loadDeployments">Refresh</button>
            <a href="#/submit">+ submit</a>
          </div>

          <p v-if="listError" class="err">{{ listError }}</p>
          <template v-else>
            <div class="scroll-x">
              <table>
                <thead>
                  <tr><th>id</th><th>kind</th><th>stack</th><th>orchestrator</th><th>state</th><th>updated</th></tr>
                </thead>
                <tbody>
                  <tr v-for="d in deployments" :key="d.id">
                    <td><a class="name" :href="'#/deployments/' + encodeURIComponent(d.id)">{{ d.id }}</a></td>
                    <td><span class="badge" :class="'k-' + d.kind">{{ d.kind }}</span></td>
                    <td class="name dim">
                      <span v-if="d.stack">{{ d.stack }}</span>
                      <span v-else class="badge warn" title="the spec could not be resolved without variables">
                        needs variables
                      </span>
                    </td>
                    <td class="mono dim">{{ d.orchestrator || '—' }}</td>
                    <!--
                      busy/running are SERVER-provided tri-state: true / false / null. `null` means
                      "could not determine" — an unresolved spec has no stack name to look up, and a
                      docker that did not answer is not the same fact as "nothing is running".
                      Rendering either as "idle" would be a guess, so unknown says unknown.
                      `asleep` is the sleep RECORD (invariant 11): not running AND not torn down, so
                      it is never folded into running/idle — it comes before both.
                    -->
                    <td>
                      <span v-if="d.busy === true" class="badge busy">busy</span>
                      <span v-else-if="d.asleep" class="badge asleep"
                            :title="'asleep since ' + stamp(d.asleep.since) + ' — ' + d.asleep.reason">asleep</span>
                      <span v-else-if="d.running === true" class="badge running">running</span>
                      <span v-else-if="d.busy === null || d.running === null"
                            class="badge unknown" title="the server could not determine this">unknown</span>
                      <span v-else class="muted">idle</span>
                    </td>
                    <td class="dim mono nowrap">{{ stamp(d.updatedAt) }}</td>
                  </tr>
                  <tr v-if="!deployments.length">
                    <td colspan="6" class="muted">
                      nothing submitted &mdash; use <a href="#/submit">Submit</a> to PUT a spec
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- One `unresolved` message per row, verbatim: it names the missing variable. -->
            <div v-for="d in unresolvedRows" :key="'u-' + d.id" class="banner warn" style="margin-top:12px">
              <b>{{ d.id }}</b> could not be resolved: <span class="mono">{{ d.unresolved }}</span>
              <p style="margin:6px 0 0">
                This listing resolves every spec with the <em>same</em> (empty) variable set, so a
                spec with a <code>${VAR}</code> in it will always show up here.
                <a :href="'#/deployments/' + encodeURIComponent(d.id) + '/config'">Set its variables</a>
                and the detail view will resolve.
              </p>
            </div>
          </template>
        </div>
      </template>

      <!-- ============================== deployment detail ============================== -->
      <template v-else-if="route.view === 'detail'">
        <div class="crumbs">
          <a href="#/deployments">&larr; deployments</a>
          <span class="name">{{ route.id }}</span>
          <span v-if="detail" class="badge" :class="'k-' + detail.kind">{{ detail.kind }}</span>
          <span v-if="detail && detail.busy === true" class="badge busy">busy</span>
          <span v-if="detail && detail.asleep" class="badge asleep">asleep</span>
          <span class="grow"></span>
          <button class="small" @click="loadDetail">Refresh</button>
        </div>

        <div class="tabs">
          <a v-for="t in TABS" :key="t" :href="tabHref(t)"
             :aria-current="route.tab === t ? 'page' : null">{{ t }}</a>
        </div>

        <!--
          A resolve failure is a 400 whose text names the missing variable. It is not a dead end: the
          fix is on the Config tab, so the load handler sends the operator there rather than leaving
          them staring at an error with no editor in reach.
        -->
        <div v-if="detailError" class="banner failed">
          <b>could not resolve this deployment.</b>
          <pre class="spec-error" style="margin-top:8px">{{ detailError }}</pre>
          <p style="margin:8px 0 0">
            If that names a variable, add it under <b>config</b> below and press
            <b>Apply &amp; reload</b>. Everything else on this page stays unavailable until the spec
            resolves &mdash; the server cannot tell us the stack name without it.
          </p>
        </div>

        <!-- ---------------- tab: overview ---------------- -->
        <div class="panel" v-if="route.tab === 'overview'">
          <h2>Resolved spec</h2>
          <p v-if="!detail && !detailError" class="muted">loading…</p>
          <ul class="list" v-if="detail">
            <li><span class="dim" style="width:120px">stack</span><span class="name stretch">{{ detail.stack || '—' }}</span></li>
            <li><span class="dim" style="width:120px">kind</span>
              <span class="stretch">
                <span class="badge" :class="'k-' + detail.kind">{{ detail.kind }}</span>
                <span class="muted" style="margin-left:8px">{{ kindBlurb }}</span>
              </span>
            </li>
            <li><span class="dim" style="width:120px">compose file</span>
              <span class="name stretch">{{ detail.compose ? detail.compose.file : '—  (no compose section)' }}</span>
            </li>
            <li v-if="detail.compose"><span class="dim" style="width:120px">profiles</span>
              <span class="stretch">
                <span v-for="p in detail.compose.profiles" :key="p" class="badge" style="margin-right:4px">{{ p }}</span>
                <span v-if="!detail.compose.profiles.length" class="muted">none &mdash; a bare up starts every service</span>
              </span>
            </li>
            <li v-if="detail.compose"><span class="dim" style="width:120px">overlays</span>
              <span class="stretch">
                <span v-for="o in detail.compose.overlays" :key="o" class="name" style="margin-right:8px">{{ o }}</span>
                <span v-if="!detail.compose.overlays.length" class="muted">none</span>
              </span>
            </li>
            <li v-if="detail.compose"><span class="dim" style="width:120px">orchestrator</span>
              <span class="mono stretch">{{ detail.orchestrator || '—' }}</span>
            </li>
            <li v-if="detail.sleep"><span class="dim" style="width:120px">sleep policy</span>
              <span class="stretch">
                <span v-if="detail.sleep.idle" class="badge" style="margin-right:4px">idle {{ detail.sleep.idle }}</span>
                <span v-if="detail.sleep.after" class="badge" style="margin-right:4px">after {{ detail.sleep.after }}</span>
                <span class="muted">&mdash; sleeps on its own; a request to its hostname wakes it</span>
              </span>
            </li>
            <li v-if="detail.asleep"><span class="dim" style="width:120px">asleep</span>
              <span class="stretch">
                since <span class="mono">{{ stamp(detail.asleep.since) }}</span>
                <span class="muted">({{ detail.asleep.reason }})</span>
                <span v-if="detail.asleep.hosts.length || detail.asleep.rules.length">
                  &mdash; wakes on a request to
                  <span class="name">{{ detail.asleep.hosts.concat(detail.asleep.rules.map((r) => '/' + r + '/')).join(', ') }}</span>
                </span>
                <span v-else class="muted">&mdash; no hostnames were found, so only <b>wake</b> brings it back</span>
              </span>
            </li>
            <li><span class="dim" style="width:120px">axes</span><span class="stretch">{{ detail.axes.length }}</span></li>
            <li><span class="dim" style="width:120px">requires</span><span class="stretch">{{ detail.requires.length }}</span></li>
            <li><span class="dim" style="width:120px">created</span><span class="mono stretch">{{ stamp(detail.createdAt) }}</span></li>
            <li><span class="dim" style="width:120px">updated</span><span class="mono stretch">{{ stamp(detail.updatedAt) }}</span></li>
          </ul>
          <p class="hint" v-if="detail">
            <code>:id</code> is the registry id (a directory name). <code>stack</code> is what the
            spec resolved to &mdash; the compose project name, and <code>$STACK</code> in every hook.
          </p>
        </div>

        <!-- ---------------- tab: config ---------------- -->
        <template v-if="route.tab === 'config'">
          <div class="panel">
            <h2>Variables for this deployment</h2>
            <!--
              THE safety rule on this page. A spec interpolates `${VAR}` once, at resolve time, and
              the registry stores the spec but NOT the variables. Every route that resolves a
              deployment layers the request's query params over process.env — so `up` with PR=7 and
              a later `down` with no PR resolve to two DIFFERENT stacks, and the teardown misses the
              containers the deploy created. Persisting them in this browser is what keeps the pair
              matched; it is convenience, not a guarantee, which is why the warning stays visible.
            -->
            <div class="banner warn">
              <b>The same variables must accompany <code>down</code> as accompanied <code>up</code>.</b>
              <p style="margin:6px 0 0">
                Variables are <em>not</em> stored with the deployment. They are sent as query
                parameters on every call, so <code>up</code> with <code>PR=7</code> and
                <code>down</code> without it target two different stacks &mdash; and the teardown
                quietly misses everything the deploy created. These pairs are kept in this browser
                (<code>localStorage</code>, keyed by deployment id) so they stay matched here, but a
                different browser, a CI job, or the CLI must pass the same ones itself.
              </p>
            </div>

            <div class="kv kv-head"><span>name</span><span>value</span><span></span></div>
            <div class="kv" v-for="(e, i) in vars" :key="i">
              <input type="text" v-model.trim="e.k" :aria-label="'variable name ' + (i + 1)"
                     placeholder="PR" spellcheck="false" @input="persistVars">
              <input type="text" v-model="e.v" :aria-label="'variable value ' + (i + 1)"
                     placeholder="7" spellcheck="false" @input="persistVars">
              <button class="small" @click="removeVar(i)" :aria-label="'remove variable ' + (i + 1)">&minus;</button>
            </div>
            <div class="row">
              <button class="small" @click="addVar">+ variable</button>
              <button class="primary" @click="applyVars">Apply &amp; reload</button>
              <span class="muted mono" v-if="varsQuery">{{ varsQuery }}</span>
            </div>
            <p class="hint">
              The <code>env</code> table below lists what the spec <em>declares</em>, which is not
              the same as what it <em>needs</em>: <code>stack: pr-${PR}</code> consumes
              <code>PR</code> without declaring it. So this editor is free-form, and the 400 message
              on the resolve error is the authoritative list of what is missing.
            </p>
          </div>

          <div class="panel">
            <h2>Declared env <span class="muted">(after interpolation)</span></h2>
            <p v-if="!detail" class="muted">unavailable until the spec resolves.</p>
            <template v-else>
              <div class="scroll-x">
                <table>
                  <thead><tr><th>key</th><th>value</th><th>visibility</th><th>length</th></tr></thead>
                  <tbody>
                    <tr v-for="e in detail.env" :key="e.key">
                      <td class="name">{{ e.key }}</td>
                      <td :class="e.visibility === 'masked' ? 'masked name' : 'name'">{{ e.value }}</td>
                      <td>
                        <span class="badge" :class="e.visibility === 'masked' ? 'warn' : ''">{{ e.visibility }}</span>
                      </td>
                      <!--
                        `length` exists so an operator can answer "did it get set at all?" without
                        the value. length 0 on a masked var is the interesting case: declared, never
                        set — which usually means a hook is about to fail on an empty credential.
                      -->
                      <td class="dim mono">
                        {{ e.length }} chars
                        <span v-if="e.length === 0" class="badge warn" style="margin-left:6px">never set</span>
                      </td>
                    </tr>
                    <tr v-if="!detail.env.length">
                      <td colspan="4" class="muted">this spec declares no <code>env:</code> block</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <!--
                Masked is not "hidden pending a click". The plaintext was never in the response, so
                there is nothing here to reveal — a reveal control would be a lie, and adding one
                would mean sending secrets to a browser tab (and into screenshots and support
                tickets). Deny-by-default by name; see src/redact.ts.
              -->
              <p class="hint">
                A <b>masked</b> value was redacted on the host because its name reads as a secret.
                The real value was never sent to this page, so there is nothing to reveal &mdash;
                only its length is shown. Read it on the host if you need it.
              </p>
            </template>
          </div>
        </template>

        <!-- ---------------- tab: axes ---------------- -->
        <div class="panel" v-if="route.tab === 'axes'">
          <h2>Axes <span class="muted">(provisioned in order, destroyed in reverse)</span></h2>
          <p v-if="!detail" class="muted">unavailable until the spec resolves.</p>
          <template v-else>
            <!-- One line that teaches the model, so the table below needs no legend of its own. -->
            <p class="hint" style="margin:0 0 10px">
              <code>up</code> provision &middot; <code>assert_live</code> it exists &middot;
              <code>down</code> destroy &middot; <code>assert_gone</code> proven gone.
              Hook <em>bodies</em> are never sent to this page &mdash; a hook is a shell string that
              routinely carries a token inline.
            </p>
            <div class="scroll-x">
              <table>
                <thead><tr><th>axis</th><th>hooks</th><th>teardown provable?</th></tr></thead>
                <tbody>
                  <tr v-for="a in detail.axes" :key="a.name">
                    <td class="name">{{ a.name }}</td>
                    <td>
                      <span v-for="h in HOOKS" :key="h" class="badge"
                            :class="a.hooks.includes(h) ? '' : 'unknown'"
                            :style="{ marginRight: '4px', opacity: a.hooks.includes(h) ? 1 : .35 }">{{ h }}</span>
                    </td>
                    <!--
                      `verifiable:false` means the axis defines no assert_gone, so `verify` CANNOT
                      prove it was cleaned up. That is a third state — neither pass nor fail — and
                      must never be coloured green: a green verify on an unverifiable axis is exactly
                      the false confidence this tool exists to remove.
                    -->
                    <td>
                      <span v-if="a.verifiable" class="badge ok">assert_gone</span>
                      <span v-else class="badge warn" title="verify cannot prove this axis was cleaned up">
                        unverifiable
                      </span>
                    </td>
                  </tr>
                  <tr v-if="!detail.axes.length">
                    <td colspan="3" class="muted">
                      no axes<span v-if="isShared"> &mdash; a shared singleton has nothing to isolate
                      and nothing to prove gone</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div v-if="unverifiableAxes.length" class="banner warn" style="margin-top:12px">
              <b>{{ unverifiableAxes.length }} axis/axes cannot be verified:</b>
              <span class="mono">{{ unverifiableAxes.join(', ') }}</span>.
              They define no <code>assert_gone</code>, so a green <code>verify</code> is silence
              about them, not proof they are gone. Add an <code>assert_gone</code> that
              <em>fails closed</em> &mdash; probe that the check itself works, then assert absence.
            </div>
          </template>
        </div>

        <!-- ---------------- tab: requires ---------------- -->
        <div class="panel" v-if="route.tab === 'requires'">
          <h2>Requires <span class="muted">(checked before anything is created)</span></h2>
          <p v-if="!detail" class="muted">unavailable until the spec resolves.</p>
          <template v-else>
            <p class="hint" style="margin:0 0 10px">
              Preconditions run first, in order, and <code>up</code> stops at the first one that
              fails &mdash; by name, before a single resource exists. The <code>assert</code> command
              itself stays on the host; only the name and its hint are sent here.
            </p>
            <div class="scroll-x">
              <table>
                <thead><tr><th>requirement</th><th>hint shown on failure</th></tr></thead>
                <tbody>
                  <tr v-for="r in detail.requires" :key="r.name">
                    <td class="name">{{ r.name }}</td>
                    <td class="dim">{{ r.hint || '— (no hint authored)' }}</td>
                  </tr>
                  <tr v-if="!detail.requires.length">
                    <td colspan="2" class="muted">
                      none declared &mdash; an isolated deployment that borrows shared infrastructure
                      usually wants at least one
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </template>
        </div>

        <!-- ---------------- tab: logs ---------------- -->
        <div class="panel" v-if="route.tab === 'logs'">
          <div class="phead">
            <h2>Compose logs</h2>
            <span class="grow"></span>
            <label for="tail">tail</label>
            <select id="tail" v-model.number="tail">
              <option :value="50">50</option>
              <option :value="200">200</option>
              <option :value="500">500</option>
              <option :value="1000">1000</option>
              <option :value="2000">2000</option>
            </select>
            <button class="small" :disabled="logsLoading || !detail || !detail.compose" @click="loadLogs">
              {{ logsLoading ? 'reading…' : 'Fetch' }}
            </button>
          </div>

          <p v-if="!detail" class="muted">unavailable until the spec resolves.</p>
          <!-- Guard on the field rather than calling and interpreting a failure after the fact. -->
          <p v-else-if="!detail.compose" class="muted">
            This spec has no <code>compose:</code> section, so there are no compose logs to read.
            Its axes may still have created resources &mdash; check those at their own source.
          </p>
          <template v-else>
            <p class="hint" style="margin:0 0 10px">
              Fetched on demand, never polled: an auto-refresh against a chatty stack would hammer
              the host through <code>docker compose logs</code>. <code>tail</code> is clamped to
              1&ndash;2000 by the server.
            </p>
            <div v-if="logsError" class="banner failed">{{ logsError }}</div>
            <!--
              `ok:false` means compose exited non-zero. Usually "no such project" because the stack
              was never brought up — not a server fault, so it is a note rather than an error.
            -->
            <div v-else-if="logs && !logs.ok" class="banner warn">
              <b>compose exited non-zero.</b> Most often the project does not exist yet (nothing has
              been brought up), or a profile is missing. Any output it did produce is below.
            </div>
            <pre class="text-out" v-if="logs">{{ logs.text || '(no output)' }}</pre>
            <p class="muted" v-else-if="!logsLoading">press <b>Fetch</b> to read the last {{ tail }} lines.</p>
            <p class="hint" v-if="logs">
              Redacted on the host before sending: credentials in URLs, <code>NAME=value</code> pairs
              whose name reads as a secret, and this server's own token.
            </p>
          </template>
        </div>

        <!-- ---------------- tab: actions ---------------- -->
        <template v-if="route.tab === 'actions'">
          <div class="panel">
            <h2>Lifecycle</h2>

            <p v-if="!detail" class="muted">
              Actions are unavailable until the spec resolves &mdash; the server cannot act on a
              deployment whose stack name it cannot compute. Fix the variables under
              <a :href="tabHref('config')">config</a> first.
            </p>

            <template v-else>
              <div v-if="health.authEnforced === true && !token" class="banner warn">
                <b>no token set.</b> Every action below is a mutating request and will be refused
                with <code>401</code>. Put <code>PSTACK_TOKEN</code> in the header field.
              </div>

              <div class="row">
                <button class="primary" :disabled="acting || detail.busy === true" @click="act('up')">up</button>
                <button :disabled="acting || detail.busy === true" @click="act('verify')">verify</button>
                <button class="danger" :disabled="acting || detail.busy === true || (isShared && !forceArmed)"
                        @click="act('down')">
                  {{ isShared ? 'down (force)' : 'down' }}
                </button>
                <!--
                  Sleep is hidden, not merely disabled, for a shared deployment: every preview that
                  depends on the singleton would go with it, and the server 409s it anyway.
                -->
                <button v-if="detail.asleep" class="primary" :disabled="acting || detail.busy === true"
                        @click="act('wake')">wake</button>
                <button v-else-if="!isShared" :disabled="acting || detail.busy === true || !detail.compose"
                        @click="act('sleep')">sleep</button>
                <span class="grow"></span>
                <a :href="'#/submit/' + encodeURIComponent(route.id)">replace spec &rarr;</a>
              </div>
              <div v-if="detail.asleep" class="banner info" style="margin-top:10px">
                <b>asleep</b> since {{ stamp(detail.asleep.since) }} ({{ detail.asleep.reason }}).
                Its volumes and axes are still there. <code>wake</code> brings it back, and so does
                <span v-if="detail.asleep.hosts.length || detail.asleep.rules.length">a request to
                  <span class="mono">{{ detail.asleep.hosts.concat(detail.asleep.rules.map((r) => '/' + r + '/')).join(', ') }}</span>.</span>
                <span v-else>&hellip; nothing else: no hostnames were found on its containers.</span>
              </div>
              <p class="hint" v-else-if="!isShared && detail.compose">
                <code>sleep</code> stops the containers but keeps <b>volumes and axes</b> &mdash;
                unlike <code>down</code>, nothing is destroyed. A request to its hostname wakes it,
                as does <code>wake</code> here.
              </p>
              <p class="hint" v-if="detail.busy === true">
                A job is in flight for <b>{{ detail.stack }}</b>. One job per stack, deliberately not
                queued &mdash; a <code>down</code> racing an <code>up</code> over the same database
                branch is corruption, not contention.
              </p>
              <p class="hint">
                Sent with <span class="mono">{{ varsQuery || 'no variables' }}</span>.
                <a :href="tabHref('config')">change</a>
              </p>

              <div class="row" style="margin-top:10px">
                <label><input type="checkbox" v-model="downVerify"> run <code>verify</code> after <code>down</code></label>
              </div>
              <p class="hint" v-if="!downVerify">
                Teardown will not check for leaks. A teardown that silently half-worked is the exact
                failure this tool exists to catch &mdash; run <code>verify</code> yourself afterwards.
              </p>

              <!--
                Gate 1 of 2, and the typed confirmation is the point: a checkbox is one stray click,
                typing the stack name is a decision. The server holds the authoritative guard —
                `down()` in stack.ts refuses a shared teardown without `force`, and the API answers
                409 before starting a job — so this is defence in depth, not the only barrier.
              -->
              <div v-if="isShared" class="banner leaked" style="margin-top:12px">
                <b>SHARED &mdash; read before tearing down.</b>
                <p style="margin:6px 0 0">
                  <code>down</code> runs <code>docker compose down -v</code>, and <code>-v</code>
                  removes <b>volumes</b>. On a shared deployment that destroys state every tenant
                  depends on &mdash; the TLS certificate store, the shared database or queue, admin
                  credentials. Nothing here recreates them: every preview on this host breaks until
                  someone rebuilds the singleton by hand. It is the identical verb that is routine
                  for a preview.
                </p>
                <div class="field" style="margin-top:10px;max-width:360px">
                  <label :for="'confirm-' + route.id">
                    Type the stack name <b>{{ detail.stack }}</b> to send <code>force: true</code>
                  </label>
                  <input :id="'confirm-' + route.id" type="text" v-model.trim="forceTyped"
                         :placeholder="detail.stack" spellcheck="false" autocomplete="off">
                </div>
                <p style="margin:6px 0 0" v-if="forceTyped && !forceArmed" class="mono">
                  does not match &mdash; <code>down</code> stays disabled
                </p>
              </div>

              <!-- ---- results of the last attempt ---- -->
              <div v-if="actionError" class="banner failed" style="margin-top:12px">
                <pre class="spec-error" style="margin:0">{{ actionError }}</pre>
              </div>

              <!--
                Not every 409 is "busy". Discriminated by payload SHAPE, never by matching text:
                  body.kind        → the shared-down refusal (route to the gate above)
                  body.containers  → DELETE refused, containers still exist
                  otherwise        → a job in flight, or docker would not answer; print verbatim
              -->
              <div v-if="conflict" class="banner" :class="conflict.kind === 'shared' ? 'leaked' : 'info'"
                   style="margin-top:12px" role="alert">
                <b>409 &mdash; refused, and nothing was started.</b>
                <pre class="text-out" style="margin:8px 0 0;max-height:200px">{{ conflict.text }}</pre>
                <p style="margin:8px 0 0" v-if="conflict.kind === 'shared'">
                  Confirm the stack name above and press <code>down</code> again.
                </p>
                <p style="margin:8px 0 0" v-else-if="conflict.kind === 'containers'">
                  Run <code>down</code> first. Forgetting the record now would orphan those
                  containers beyond the control plane's view: nothing left would know their stack
                  name, their axes, or how to tear them down.
                </p>
                <p style="margin:8px 0 0" v-else-if="conflict.jobId">
                  <a :href="'#/jobs/' + encodeURIComponent(conflict.jobId)">Follow the running job &rarr;</a>
                </p>
                <p style="margin:8px 0 0" v-else>
                  Nothing was retried. Wait for the lock to clear, then try again.
                </p>
              </div>
            </template>
          </div>

          <!-- ---- forget ---- -->
          <div class="panel">
            <h2>Forget this deployment</h2>
            <!--
              Gated on a resolved spec for the same reason the lifecycle actions are: DELETE resolves
              the stack server-side to count its containers, so an unresolved spec 400s before the
              guard can even run.
            -->
            <p v-if="!detail" class="muted">
              Unavailable until the spec resolves &mdash; the server counts this stack's containers
              before it will forget the record, and it cannot name the stack without its variables.
            </p>
            <template v-else>
            <p class="dim">
              <code>DELETE</code> removes the <em>record</em> &mdash; the stored

              <b>It never tears anything down.</b> The server refuses with <code>409</code> while any
              container for this stack still exists, and refuses just as firmly when docker did not
              answer: &ldquo;cannot confirm&rdquo; is not evidence of absence.
            </p>
            <p class="hint">
              After forgetting, this deployment disappears from the control plane. If a resource an
              axis created is still alive, nothing here knows how to remove it any more.
            </p>
            <div class="row" style="margin-top:10px">

              <li><span class="dim" style="width:100px">took</span><span class="mono stretch">{{ took(job) }}</span></li>

</template><span v-if="!lines.length" class="muted">no log lines</span></pre>

                    <td class="mono dim">{{ s.phase }}</td>
                    <td :class="'s-' + stepState(s)">{{ stepText(s) }}</td>

              <span class="s-unverifiable">? unverifiable &mdash; nothing to check, not a pass</span>.
              A <code>down</code> step marked ok may still carry a <code>non-fatal:</code> note:
              teardown is best-effort by design, so aborting halfway would leave more behind than
              continuing.
            </p>
          </div>
          <p v-else-if="job.state === 'queued'" class="muted">

          <p v-else-if="job.state === 'superseded'" class="muted">

          </p>
          <p v-else-if="job.state !== 'running'" class="muted">

          <p><a href="#/">&larr; overview</a></p>
        </div>

    </main>
