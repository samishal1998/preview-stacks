<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
'use strict';
const { createApp } = Vue;

/** Hook names, in the order `up` / `verify` actually use them. Also the column order in Axes. */
const HOOKS = ['up', 'assert_live', 'down', 'assert_gone'];
const TABS = ['overview', 'config', 'axes', 'requires', 'logs', 'actions', 'share'];
/** What `GET /api/swarm/join?distro=` accepts (src/cloudinit.ts). */
const DISTROS = ['ubuntu', 'debian', 'fedora', 'suse', 'arch', 'alpine'];
const VARS_KEY = 'pstack.vars.';
const enc = encodeURIComponent;

const EXAMPLE_SPEC = `version: 1
kind: isolated

# The stack identity: the compose project name, and $STACK inside every hook.
# \${PR} is interpolated ONCE, at resolve time, from the variables sent with the request.
stack: pr-\${PR}

env:
  PREVIEW_DOMAIN: preview.example.com

compose:
  file: compose.yml
  # Every service sits behind a profile so a bare \`up\` starts nothing.
  # \`down\` always enables ALL of them — otherwise the unselected profiles' network leaks.
  profiles: [app]

requires:
  - name: traefik-network
    assert: docker network inspect traefik >/dev/null 2>&1
    hint: run \`pstack init\` on the host first

axes:
  # Hooks run from the deployment directory, which holds only spec.yml and compose.yml —
  # so use inline shell or absolute paths, never ./hooks/foo.sh.
  - name: scratch
    up: mkdir -p /tmp/$STACK
    assert_live: test -d /tmp/$STACK
    down: rm -rf /tmp/$STACK
    # assert_gone MUST FAIL CLOSED. A bare \`! <probe>\` reports "gone" whenever the probe fails
    # for any reason — a missing CLI, an expired token — turning "I could not tell" into
    # "it is gone", a false negative on the one thing this tool exists to catch.
    assert_gone: |
      test -d /tmp || exit 1
      ! test -d /tmp/$STACK
`;

const EXAMPLE_COMPOSE = `services:
  app:
    image: nginx:alpine
    profiles: [app]
    labels:
      - traefik.enable=true
`;

/** `#/deployments/acme/logs` → a route object. Unknown shapes fall through to `unknown`. */
function parseRoute() {
  const raw = String(location.hash || '').replace(/^#\/?/, '');
  const seg = raw.split('/').filter(Boolean).map((s) => {
    try { return decodeURIComponent(s); } catch { return s; }
  });
  if (!seg.length) return { view: 'overview', id: '', tab: '', jobId: '', raw };
  const base = { view: 'unknown', id: '', tab: '', jobId: '', raw };
  if (seg[0] === 'deployments') {
    if (!seg[1]) return { ...base, view: 'list' };
    // An unrecognised tab segment falls back to `overview` rather than rendering nothing.
    return { ...base, view: 'detail', id: seg[1], tab: TABS.includes(seg[2]) ? seg[2] : 'overview' };
  }
  if (seg[0] === 'jobs') return seg[1] ? { ...base, view: 'job', jobId: seg[1] } : { ...base, view: 'jobs' };
  if (seg[0] === 'submit') return { ...base, view: 'submit', id: seg[1] || '' };
  if (seg[0] === 'swarm') return { ...base, view: 'swarm' };
  return base;
}

/** Variable pairs → `?PR=7&REGION=eu`, plus any extra params. Empty names are dropped. */
function query(pairs, extra) {
  const p = new URLSearchParams();
  for (const e of pairs || []) if (e && e.k) p.set(e.k, e.v == null ? '' : String(e.v));
  for (const [k, v] of Object.entries(extra || {})) p.set(k, String(v));
  const s = p.toString();
  return s ? `?${s}` : '';
}

createApp({
  data() {
    return {
      HOOKS, TABS, DISTROS,
      route: parseRoute(),

      token: localStorage.getItem('pstack.token') || '',
      // The signed-in principal from /api/auth/me, or null. Drives the sign-in row.
      me: null,
      loginUser: '', loginPass: '', loginError: '',
      // Set by the SSO callback when the round trip failed. Read once, at load.
      ssoError: new URLSearchParams(location.search).get('sso_error') || '',
      health: {}, healthError: '',

      control: {}, controlLoaded: false, controlError: '',
      deployments: [], listError: '',
      jobs: [], jobsError: '',

      // ---- detail ----
      detail: null, detailError: '',
      vars: [], tail: 200,
      logs: null, logsError: '', logsLoading: false,
      acting: false, actionError: '', conflict: null,
      downVerify: true, forceTyped: '', forgetArmed: false,
      // The minted link lives here and nowhere else — never in localStorage (it carries the token).
      share: { details: true, logs: true, ttl: '7d' }, shareResult: null, shareError: '', sharing: false,

      // ---- swarm ----
      swarm: null, swarmError: '', swarmAt: 0,
      joinFormat: 'command', joinDistro: 'ubuntu', join: '', joinError: '', joinLoading: false,
      copied: '', copyError: '',

      // ---- job ----
      job: null, jobError: '', lines: [], es: null, following: false,
      autoscroll: true, streamDropped: false,

      // ---- submit ----
      form: { id: '', spec: '', compose: '', env: [{ k: '', v: '' }] },
      submitting: false, submitError: '', submitResult: null,

      poll: 0,
      defaultControlNote:
        'The control stack is not managed through this API: the process serving this request runs ' +
        'inside it.',
    };
  },

  computed: {
    isShared() { return !!this.detail && this.detail.kind === 'shared'; },

    /** Typed confirmation, exact match against the resolved stack name. Nothing looser. */
    forceArmed() {
      return !!this.detail && !!this.detail.stack && this.forceTyped === this.detail.stack;
    },

    varsQuery() { return query(this.vars); },

    unverifiableAxes() {
      return (this.detail ? this.detail.axes : []).filter((a) => !a.verifiable).map((a) => a.name);
    },

    unresolvedRows() { return this.deployments.filter((d) => d.unresolved); },

    /**
     * Counts for the overview. `busy` and `running` are tri-state, so an unknown is counted in its
     * own bucket — never folded into the false side.
     */
    summary() {
      const c = { total: 0, shared: 0, isolated: 0, busy: 0, running: 0, unknown: 0, unresolved: 0 };
      for (const d of this.deployments) {
        c.total++;
        if (d.kind === 'shared') c.shared++; else c.isolated++;
        if (d.busy === true) c.busy++;
        if (d.running === true) c.running++;
        if (d.busy == null || d.running == null) c.unknown++;
        if (d.unresolved) c.unresolved++;
      }
      return c;
    },

    steps() { return (this.job && this.job.outcome && this.job.outcome.steps) || []; },

    /** Only `assert_gone` failing is a leak. Every other non-zero step is a plain failure. */
    leakedAxes() {
      return this.steps.filter((s) => s.phase === 'assert_gone' && !s.ok).map((s) => s.axis);
    },

    unverifiableSteps() {
      return this.steps.filter((s) => this.stepState(s) === 'unverifiable').length;
    },

    kindBlurb() {
      return this.isShared
        ? 'a host singleton previews borrow — no axes, and down is guarded'
        : 'one tenant, created and destroyed constantly, expected to leave nothing behind';
    },
  },

  watch: {
    token(v) { localStorage.setItem('pstack.token', v); },
    /**
     * One place that reacts to navigation. Closing the stream here (not only on a `done` frame) is
     * what stops a leak the old single-screen UI could not have: navigating away from a running job
     * would otherwise keep the EventSource open, appending to a `lines` array nobody is watching.
     */
    route: {
      handler(to, from) {
        if (!from || to.view !== 'job' || to.jobId !== from.jobId) this.closeStream();
        this.onRoute(to, from);
      },
    },
  },

  mounted() {
    addEventListener('hashchange', this.onHash);
    this.loadHealth();
    // A session cookie may already be present (a prior sign-in here, or one in the advanced UI —
    // same origin, same cookie). Resolve it so the header shows who instead of the sign-in row.
    this.whoami();
    // Unconditional, so the nav's deployment count is right even on a deep link into Jobs.
    this.loadDeployments();
    this.onRoute(this.route, null);
    // The whole point of `busy` is being current, and the server holds the lock — not us. Only the
    // views that display it poll, and never the log (SSE) or compose logs (expensive).
    this.poll = setInterval(() => {
      if (this.route.view === 'overview') { this.loadDeployments(); this.loadJobs(); }
      else if (this.route.view === 'list') this.loadDeployments();
      else if (this.route.view === 'jobs') this.loadJobs();
      // Every other tick: the swarm panel polls at 10s, and the join token is never part of it.
      else if (this.route.view === 'swarm' && Date.now() - this.swarmAt >= 9500) this.loadSwarm();
    }, 5000);
  },

  beforeUnmount() {
    removeEventListener('hashchange', this.onHash);
    clearInterval(this.poll);
    this.closeStream();
  },

  methods: {
    onHash() { this.route = parseRoute(); },
    go(path) { location.hash = `#${path}`; },
    tabHref(t) { return `#/deployments/${enc(this.route.id)}/${t}`; },

    /** Load exactly what the destination view needs, and nothing else. */
    onRoute(to, from) {
      const sameDeployment = from && from.view === 'detail' && from.id === to.id;
      if (to.view === 'overview') { this.loadControl(); this.loadDeployments(); this.loadJobs(); }
      if (to.view === 'list') this.loadDeployments();
      if (to.view === 'jobs') this.loadJobs();
      if (to.view === 'job') { if (!from || from.jobId !== to.jobId) this.loadJob(to.jobId); }
      if (to.view === 'submit') this.prepareSubmit(to.id);
      // Both secrets are shown once: leaving the screen that revealed them is what clears them.
      this.join = '';
      this.joinError = '';
      if (to.view === 'swarm') this.loadSwarm();
      if (to.view !== 'detail') { this.shareResult = null; this.shareError = ''; }
      if (to.view === 'detail') {
        // Switching tabs must not re-fetch or wipe the panel. Only a different deployment does.
        if (!sameDeployment) {
          this.vars = this.readVars(to.id);
          this.forceTyped = '';
          this.forgetArmed = false;
          this.conflict = null;
          this.actionError = '';
          this.logs = null;
          this.logsError = '';
          this.shareResult = null;
          this.shareError = '';
          this.detail = null;
          this.loadDeployments();
          this.loadDetail();
        }
      }
    },

    // ---- transport ---------------------------------------------------------------------
    /**
     * The one fetch path. Since 0.10.0 EVERY route requires auth, reads included, so the bearer
     * rides on everything when set. With no token, the session cookie from the sign-in row carries
     * the request — fetch attaches same-origin cookies by default, and that is also what keeps the
     * log stream working: `EventSource` cannot send headers, but it sends cookies.
     */
    async api(method, path, body) {
      const headers = {};
      if (method !== 'GET') headers['content-type'] = 'application/json';
      if (this.token) headers.authorization = `Bearer ${this.token}`;
      try {
        const r = await fetch(path, {
          method, headers,
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        const text = await r.text();
        let parsed = null;
        try { parsed = text ? JSON.parse(text) : null; } catch { /* handled below */ }
        // A non-JSON body means we are talking to something that is not this API — a proxy error
        // page, most often. Say that instead of throwing on `undefined.error`.
        if (parsed === null && text) {
          return { status: r.status, ok: r.ok, body: {}, raw: text, notJson: true };
        }
        return { status: r.status, ok: r.ok, body: parsed || {}, raw: text };
      } catch (e) {
        return { status: 0, ok: false, body: { error: `unreachable: ${e.message}` } };
      }
    },

    get(path) { return this.api('GET', path); },

    /**
     * Leave for the provider's consent screen. `location.assign`, not fetch: the flow is a pair of
     * redirects and the session cookie is set on the way back, so nothing here has a response to
     * read. `next` is a same-origin path — the server refuses anything else.
     */
    signInWithProvider() {
      location.assign('/api/auth/sso/start?next=' + encodeURIComponent(location.pathname === '/login' ? '/' : location.pathname + location.hash));
    },
    async signIn() {
      this.loginError = '';
      const r = await this.api('POST', '/api/auth/login', { username: this.loginUser, password: this.loginPass });
      this.loginPass = '';
      if (!r.ok) { this.loginError = r.body.error || 'sign-in failed'; return; }
      this.me = { root: false, user: r.body.user };
      // Reload what the pre-auth mount could not: the same calls mounted() makes.
      this.loadDeployments();
      this.onRoute(this.route, null);
    },
    async signOut() {
      await this.api('POST', '/api/auth/logout', {});
      this.me = null;
    },
    async whoami() {
      const r = await this.api('GET', '/api/auth/me');
      this.me = r.ok ? r.body : null;
    },

    /**
     * Turn a non-2xx into text that names the call. A bare 404 is ambiguous — "no such deployment"
     * or "this build of the API has no such route" — and the second is a very different problem, so
     * say both rather than crashing on a missing field.
     */
    problem(res, what) {
      if (res.status === 0) return res.body.error;
      if (res.status === 401) return `${what}: 401 unauthorized — set the token in the header field.`;
      if (res.notJson) {
        return `${what}: HTTP ${res.status}, and the response was not JSON. Something other than ` +
               `the pstack API answered — a proxy or an error page.\n\n${String(res.raw).slice(0, 400)}`;
      }
      const e = res.body && res.body.error;
      if (res.status === 404 && (!e || e === 'not found')) {
        return `${what}: 404 — no such resource, or this build of the API has no such route yet.`;
      }
      return e ? `${what}: ${e}` : `${what}: HTTP ${res.status}`;
    },

    // ---- loaders -----------------------------------------------------------------------
    async loadHealth() {
      const r = await this.get('/api/health');
      if (r.ok) { this.health = r.body || {}; this.healthError = ''; }
      else this.healthError = this.problem(r, 'GET /api/health');
    },

    async loadControl() {
      const r = await this.get('/api/control');
      this.controlLoaded = true;
      if (!r.ok) { this.controlError = this.problem(r, 'GET /api/control'); return; }
      this.controlError = '';
      const b = r.body || {};
      this.control = {
        project: b.project || '',
        reachable: b.reachable !== false,
        parseError: !!b.parseError,
        services: Array.isArray(b.services) ? b.services : [],
        managedBy: b.managedBy || '',
        note: b.note || '',
        // Read but never trusted to be `true`: this view has no actions regardless of what the
        // payload says. The field exists so a UI cannot claim it was not told.
        actionable: b.actionable === true,
      };
    },

    async loadDeployments() {
      const r = await this.get('/api/deployments');
      if (!r.ok) { this.listError = this.problem(r, 'GET /api/deployments'); return; }
      this.listError = '';
      const rows = Array.isArray(r.body.deployments) ? r.body.deployments : [];
      this.deployments = rows.map((d) => ({
        ...d,
        kind: d.kind === 'shared' ? 'shared' : 'isolated',
        // Normalise "absent" to null so the tri-state stays a tri-state. `?? null` — not `|| null`
        // — because `false` is a real, different answer from "could not tell".
        busy: d.busy ?? null,
        running: d.running ?? null,
        stack: d.stack || '',
        asleep: d.asleep || null,
        orchestrator: d.orchestrator || null,
      }));
    },

    async loadJobs() {
      const r = await this.get('/api/jobs');
      if (!r.ok) { this.jobsError = this.problem(r, 'GET /api/jobs'); return; }
      this.jobsError = '';
      this.jobs = Array.isArray(r.body.jobs) ? r.body.jobs : [];
    },

    async loadDetail() {
      const id = this.route.id;
      const r = await this.get(`/api/deployments/${enc(id)}${this.varsQuery}`);
      if (this.route.id !== id) return; // navigated away mid-flight
      if (!r.ok) {
        this.detail = null;
        this.detailError = this.problem(r, `GET /api/deployments/${id}`);
        // The fix lives on the config tab, so put the operator in front of the editor rather than
        // in front of an error with no control in reach.
        if (this.route.tab === 'overview') this.go(`/deployments/${enc(id)}/config`);
        return;
      }
      this.detailError = '';
      const b = r.body || {};
      this.detail = {
        id: b.id || id,
        kind: b.kind === 'shared' ? 'shared' : 'isolated',
        createdAt: b.createdAt,
        updatedAt: b.updatedAt,
        stack: typeof b.stack === 'string' ? b.stack : '',
        busy: b.busy ?? null,
        orchestrator: b.orchestrator || null,
        sleep: b.sleep ? { idle: b.sleep.idle || null, after: b.sleep.after || null } : null,
        asleep: b.asleep
          ? {
              since: b.asleep.since,
              reason: b.asleep.reason || '',
              hosts: Array.isArray(b.asleep.hosts) ? b.asleep.hosts : [],
              rules: Array.isArray(b.asleep.rules) ? b.asleep.rules : [],
            }
          : null,
        compose: b.compose
          ? {
              file: b.compose.file || '?',
              profiles: b.compose.profiles || [],
              overlays: b.compose.overlays || [],
            }
          : null,
        requires: Array.isArray(b.requires) ? b.requires : [],
        axes: (Array.isArray(b.axes) ? b.axes : []).map((a) => ({
          name: a.name,
          hooks: Array.isArray(a.hooks) ? a.hooks : [],
          // Derive it if an older build omits the field, rather than claiming unverifiable.
          verifiable: a.verifiable ?? (Array.isArray(a.hooks) && a.hooks.includes('assert_gone')),
        })),
        env: Array.isArray(b.env) ? b.env : [],
      };
    },

    async loadLogs() {
      if (!this.detail || !this.detail.compose) return;
      const id = this.route.id;
      this.logsLoading = true;
      this.logsError = '';
      const r = await this.get(`/api/deployments/${enc(id)}/logs${query(this.vars, { tail: this.tail })}`);
      this.logsLoading = false;
      if (this.route.id !== id) return;
      if (!r.ok) { this.logs = null; this.logsError = this.problem(r, 'GET logs'); return; }
      this.logs = { ok: r.body.ok !== false, text: r.body.text || '', stack: r.body.stack || '' };
    },

    // ---- variables ---------------------------------------------------------------------
    /**
     * Per-deployment, in this browser. Keyed by deployment id, because the variables that produced
     * a stack on `up` are exactly the ones the later `down` must send — see the banner on the
     * config tab. Corrupt or absent storage degrades to one empty pair, never to a thrown error.
     */
    readVars(id) {
      try {
        const raw = JSON.parse(localStorage.getItem(VARS_KEY + id) || '[]');
        const pairs = Array.isArray(raw)
          ? raw.filter((e) => e && typeof e.k === 'string').map((e) => ({ k: e.k, v: String(e.v ?? '') }))
          : [];
        return pairs.length ? pairs : [{ k: '', v: '' }];
      } catch {
        return [{ k: '', v: '' }];
      }
    },

    /** Written against the id in the URL right now, so a mid-navigation save cannot cross wires. */
    persistVars() {
      const id = this.route.id;
      if (!id) return;
      try {
        localStorage.setItem(VARS_KEY + id, JSON.stringify(this.vars.filter((e) => e.k)));
      } catch { /* private mode / quota — the pairs still work for this page load */ }
    },

    addVar() { this.vars.push({ k: '', v: '' }); },
    removeVar(i) { this.vars.splice(i, 1); if (!this.vars.length) this.addVar(); this.persistVars(); },

    applyVars() {
      this.persistVars();
      this.logs = null;
      this.loadDetail();
    },

    // ---- actions -----------------------------------------------------------------------
    async act(action) {
      if (!this.detail) return;
      this.acting = true;
      this.actionError = '';
      this.conflict = null;
      const path = `/api/deployments/${enc(this.route.id)}/${action}${this.varsQuery}`;
      const body = action === 'down'
        // `force` is only ever true for a shared deployment whose stack name was typed out. The
        // server's own refusal is the guard that actually holds; this is the second lock.
        ? { verify: this.downVerify, force: this.isShared && this.forceArmed }
        : {};
      const r = await this.api('POST', path, body);
      this.acting = false;

      if (r.status === 202) {
        const job = r.body.job;
        if (job && job.id) { this.loadDeployments(); this.go(`/jobs/${enc(job.id)}`); return; }
        this.actionError = '202 accepted, but the response carried no job id — nothing to follow.';
        return;
      }
      if (r.status === 409) return this.onConflict(r);
      this.actionError = this.problem(r, `POST ${action}`);
    },

    async forget() {
      if (!this.forgetArmed) return;
      this.acting = true;
      this.actionError = '';
      this.conflict = null;
      const r = await this.api('DELETE', `/api/deployments/${enc(this.route.id)}${this.varsQuery}`);
      this.acting = false;
      if (r.ok) { this.forgetArmed = false; this.loadDeployments(); this.go('/deployments'); return; }
      if (r.status === 409) return this.onConflict(r);
      this.actionError = this.problem(r, 'DELETE deployment');
    },

    // ---- share -------------------------------------------------------------------------
    /** Keeps `url`, `views`, `expiresAt` — the `token` field is dropped on arrival. */
    async mintShare() {
      const views = ['details', 'logs'].filter((v) => this.share[v]);
      if (!views.length) return;
      this.sharing = true;
      this.shareError = '';
      this.shareResult = null;
      const r = await this.api('POST', `/api/deployments/${enc(this.route.id)}/share`, { views, ttl: this.share.ttl });
      this.sharing = false;
      if (r.status !== 201 || !r.body.url) { this.shareError = this.problem(r, 'POST share'); return; }
      this.shareResult = { url: r.body.url, views: r.body.views || views, expiresAt: r.body.expiresAt };
    },

    // ---- swarm -------------------------------------------------------------------------
    async loadSwarm() {
      this.swarmAt = Date.now();
      const r = await this.get('/api/swarm');
      if (!r.ok) { this.swarmError = this.problem(r, 'GET /api/swarm'); return; }
      this.swarmError = '';
      const b = r.body || {};
      this.swarm = {
        // Absent reads as "did not answer", never as active: the safe side of invariant 11.
        reachable: b.reachable === true,
        active: b.active === true,
        nodeId: b.nodeId || '',
        managerAddr: b.managerAddr || '',
        nodes: Array.isArray(b.nodes) ? b.nodes : [],
        ports: Array.isArray(b.ports) ? b.ports : [],
        error: b.error || '',
        note: b.note || '',
      };
    },

    /** text/plain, on click only. The `api` helper keeps the raw body, so nothing else is needed. */
    async revealJoin() {
      this.join = '';
      this.joinError = '';
      this.joinLoading = true;
      const distro = this.joinFormat === 'cloud-config' ? `&distro=${enc(this.joinDistro)}` : '';
      const r = await this.get(`/api/swarm/join?format=${enc(this.joinFormat)}${distro}`);
      this.joinLoading = false;
      if (r.ok) { this.join = r.raw || ''; return; }
      if (r.status === 403) {
        this.joinError = '403 — the join token is admin-only. Sign in as an admin, or use the root bearer token.';
        return;
      }
      if (r.status === 409) {
        this.joinError = '409 — this daemon is not a swarm manager, so there is nothing to join. Nothing was revealed.';
        return;
      }
      this.joinError = this.problem(r, 'GET /api/swarm/join');
    },

    async copy(text) {
      this.copied = '';
      this.copyError = '';
      try {
        await navigator.clipboard.writeText(text);
        this.copied = text;
      } catch {
        this.copyError = 'clipboard unavailable here (not a secure origin?) — select the text and copy it by hand.';
      }
      setTimeout(() => { this.copied = ''; }, 2000);
    },

    /**
     * A 409 is not one thing, and guessing wrong is misleading. Discriminate on payload SHAPE, never
     * on the message text:
     *   `kind`        the shared-`down` refusal — the fix is the typed confirmation, not waiting
     *   `containers`  DELETE refused because containers still exist — the fix is `down` first
     *   otherwise     a job in flight, or "docker did not answer" (DELETE's fail-closed case).
     *                 Both are shape-identical, so do not classify them: print the server's message
     *                 and only offer "attach" when a running job with that stack really exists.
     * Never retry.
     */
    async onConflict(r) {
      const b = r.body || {};
      const text = b.error || `HTTP 409 (no message)`;
      if (b.kind) { this.conflict = { kind: 'shared', text }; this.forceTyped = ''; return; }
      if (b.containers !== undefined) { this.conflict = { kind: 'containers', text }; return; }

      this.conflict = { kind: 'other', text, jobId: '' };
      const stack = b.stack || (this.detail && this.detail.stack) || '';
      if (!stack) return;
      const jl = await this.get('/api/jobs');
      const live = (jl.body.jobs || []).find((j) => j.state === 'running' && j.stack === stack);
      if (live && this.conflict) this.conflict.jobId = live.id;
    },

    // ---- job following -----------------------------------------------------------------
    async loadJob(id) {
      this.closeStream();
      this.job = null;
      this.jobError = '';
      this.lines = [];
      this.streamDropped = false;
      const r = await this.get(`/api/jobs/${enc(id)}`);
      if (this.route.jobId !== id) return;
      if (!r.ok) { this.jobError = this.problem(r, `GET /api/jobs/${id}`); return; }
      this.job = r.body.job || null;
      if (!this.job) { this.jobError = 'the server returned no job record for that id.'; return; }
      // QUEUED counts as "not over yet". A queued job's stream stays open and silent until it
      // dispatches, then delivers the log — treating it as finished renders an empty page that
      // never updates, even once the job runs. The same one-line mistake (`=== 'running'` where
      // "not terminal" was meant) was found in sse.go, the cancel guard and the SDK's waitForJob.
      if (this.job.state === 'running' || this.job.state === 'queued') {
        // The stream replays the whole buffered log first, so seeding `lines` from `job.log` here
        // would double every line already emitted.
        this.follow(id);
      } else {
        this.lines = this.job.log || [];
        this.scrollLog();
      }
    },

    follow(id) {
      this.closeStream();
      this.lines = [];
      this.streamDropped = false;
      this.autoscroll = true;
      const es = new EventSource(`/api/jobs/${enc(id)}/stream`);
      this.es = es;
      this.following = true;
      es.onmessage = (ev) => {
        let e;
        try { e = JSON.parse(ev.data); } catch { return; }
        if (e && e.done) { this.closeStream(); this.settle(id); return; }
        this.lines.push(e);
        this.scrollLog();
      };
      es.onerror = () => {
        // A stream can end without a `done` frame: server restart, proxy timeout, or a job that
        // outlived the server's 240s idle window. Fall back to the record rather than leaving the
        // page pinned on "running" forever.
        this.closeStream();
        this.streamDropped = true;
        this.settle(id);
      };
    },

    closeStream() {
      if (this.es) this.es.close();
      this.es = null;
      this.following = false;
    },

    /** The job is over: re-read the record for `outcome`, and refresh what the lock made stale. */
    async settle(id) {
      const r = await this.get(`/api/jobs/${enc(id)}`);
      if (this.route.view !== 'job' || this.route.jobId !== id) return;
      if (r.ok && r.body.job) this.job = r.body.job;
      else if (this.job) {
        this.job = {
          ...this.job, state: 'failed',
          error: 'lost the job record — the server restarted? Job history is in memory only.',
        };
      }
      // The stack lock is released, so both of these are stale the moment the job ends.
      this.loadDeployments();
      this.loadJobs();
    },

    scrollLog() {
      if (!this.autoscroll) return;
      this.$nextTick(() => {
        const el = this.$refs.logEl;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },

    /** Scrolling up is an intent to read; stop fighting it. Returning to the bottom re-arms. */
    onLogScroll(e) {
      const el = e.target;
      this.autoscroll = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
    },

    // ---- submit ------------------------------------------------------------------------
    prepareSubmit(id) {
      this.submitError = '';
      this.submitResult = null;
      // Arriving to replace a DIFFERENT deployment must not carry the previous one's spec across.
      // There is no route that returns a stored spec, so this form can never pre-fill the body —
      // and a leftover body is the dangerous case: it is a perfectly valid spec, so a PUT would
      // replace the wrong deployment's spec and nothing on the server could catch it.
      if (id && id !== this.form.id) {
        this.form.spec = '';
        this.form.compose = '';
      }
      if (id) {
        this.form.id = id;
        // Seed the env editor from this deployment's saved variables: replacing a spec usually
        // needs the same ones that resolved it.
        const saved = this.readVars(id);
        if (saved.some((e) => e.k)) this.form.env = saved.map((e) => ({ ...e }));
      }
      if (!this.form.env.length) this.form.env = [{ k: '', v: '' }];
    },

    fillExample() {
      this.form.spec = EXAMPLE_SPEC;
      if (!this.form.compose.trim()) this.form.compose = EXAMPLE_COMPOSE;
      if (!this.form.id) this.form.id = 'pr-123';
      if (!this.form.env.some((e) => e.k)) this.form.env = [{ k: 'PR', v: '123' }];
    },

    async submit() {
      this.submitting = true;
      this.submitError = '';
      this.submitResult = null;
      const env = {};
      for (const e of this.form.env) if (e.k) env[e.k] = e.v;
      const body = { spec: this.form.spec, env };
      if (this.form.compose.trim()) body.compose = this.form.compose;

      const id = this.form.id;
      const r = await this.api('PUT', `/api/deployments/${enc(id)}`, body);
      this.submitting = false;

      if (r.status === 200 || r.status === 201) {
        this.submitResult = { id: r.body.id || id, stack: r.body.stack || '?', created: r.status === 201 };
        // Persist the variables that just validated this spec as the deployment's own. This is the
        // single thing that keeps a later `down` targeting the same stack the `up` created.
        try {
          localStorage.setItem(VARS_KEY + id, JSON.stringify(this.form.env.filter((e) => e.k)));
        } catch { /* ignore */ }
        this.loadDeployments();
        return;
      }
      if (r.status === 409) {
        // A stack with a job in flight cannot have its spec swapped: the eventual `down` would tear
        // down with different profiles and axes than the `up` created.
        this.submitError = this.problem(r, `PUT /api/deployments/${id}`);
        return;
      }
      // 400 carries the SpecError verbatim — the whole reason this is a <pre>.
      this.submitError = this.problem(r, `PUT /api/deployments/${id}`);
    },

    // ---- step states -------------------------------------------------------------------
    /**
     * Four states that must not blur into each other:
     *   leaked        `assert_gone` failed — the resource SURVIVED teardown. The signal this whole
     *                 tool exists for, and the CLI's distinct exit code 2.
     *   failed        any other non-zero step, including a refused shared `down`.
     *   unverifiable  no `assert_gone` defined. NOT a pass. Matched on the message, exactly as the
     *                 CLI's report() does — `skipped` alone is also true of a dry run.
     *   ok            passed. A `down` step is ALWAYS ok:true and may still carry a "non-fatal:"
     *                 message: teardown is best-effort by design, so the step really did pass.
     */
    stepState(s) {
      if (s.message && s.message.startsWith('unverifiable')) return 'unverifiable';
      if (!s.ok) return s.phase === 'assert_gone' ? 'leaked' : 'failed';
      return 'ok';
    },

    stepMark(s) {
      return { ok: '✓', unverifiable: '?', leaked: '!', failed: '✗' }[this.stepState(s)];
    },

    stepText(s) {
      if (s.message) return s.message;
      if (s.skipped) return 'skipped';
      return this.stepState(s) === 'ok' ? 'ok' : `exit ${s.code}`;
    },

    // ---- formatting --------------------------------------------------------------------
    hhmmss(ms) { return ms ? new Date(ms).toTimeString().slice(0, 8) : '--:--:--'; },

    /** Local time, ISO-shaped (`sv` renders `2026-07-28 05:17:00`) — sortable, and the same clock
     *  the log lines use. No zone marker: everything on this page is the viewer's local time. */
    stamp(ms) { return ms ? new Date(ms).toLocaleString('sv') : '—'; },

    took(j) {
      if (!j || !j.startedAt) return '—';
      const end = j.endedAt || Date.now();
      const s = Math.max(0, Math.round((end - j.startedAt) / 1000));
      const text = s < 60 ? `${s}s` : `${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}s`;
      return j.endedAt ? text : `${text}…`;
    },
  },
}).mount('#app');
</script>
</body>
</html>
