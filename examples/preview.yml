# preview.yml — a per-PR preview stack with four isolation axes.
#
# This is the shape extracted from a production setup: a shared host runs always-on infra
# (ingress + a Temporal cluster + a registry pull secret), and each PR gets its own compose
# project alongside it. The interesting part is not the compose file — it is that a preview
# needs per-PR *stateful* resources that compose knows nothing about.
#
# Run it:
#   PR=123 pstack -f examples/preview.yml validate
#   PR=123 pstack -f examples/preview.yml up --dry-run
#   PR=123 pstack -f examples/preview.yml down --dry-run
#
# Axes are provisioned top-to-bottom and destroyed bottom-to-top, so declare a dependency
# before whatever depends on it.
#
# ── READ THIS BEFORE WRITING AN assert_gone ────────────────────────────────────────────────
# `assert_gone` must FAIL CLOSED. A naive `! <probe>` reports "gone" whenever the probe command
# fails for ANY reason — a missing CLI, an expired token, an unreachable API — so "I could not
# tell" silently becomes "it is gone", which is a false negative on the one thing this tool
# exists to catch.
#
#   WRONG:  ! docker exec shared-temporal-1 temporal ... describe --namespace "$STACK"
#           (docker not installed → non-zero → `!` makes it 0 → reported GONE)
#
#   RIGHT:  probe the tool first, then assert absence:
#             docker info >/dev/null 2>&1 || exit 1     # can't tell ⇒ FAIL, don't guess
#             ! docker exec ... describe --namespace "$STACK" >/dev/null 2>&1
#
# `|| true` belongs on `down` (best-effort) and NEVER on an assert.
# ───────────────────────────────────────────────────────────────────────────────────────────

version: 1

# The stack identity. Becomes the compose project name, a hostname label, and $STACK in hooks.
stack: pr-${PR}

env:
  # Everything here is interpolated once, then handed to compose and to every hook.
  PR_NUMBER: ${PR}
  PREVIEW_DOMAIN: preview.example.com
  REGISTRY: <region>-docker.pkg.dev/<your-project>/<repo>
  IMAGE_TAG: ${GIT_SHA}

compose:
  file: docker-compose.preview.yml
  # Every service sits behind a profile so a bare `up` starts nothing. `up` enables only what you
  # list here; `down` always enables ALL of them (otherwise the unselected profiles' network leaks).
  profiles: [backend, frontend]

axes:
  # ── 1. Database ─────────────────────────────────────────────────────────────────────────
  # Delete-and-recreate rather than reuse: a reused branch carries the previous commit's
  # migrations, which is how preview schemas silently drift from main.
  # `up` prints DATABASE_URL=… on stdout; pstack captures KEY=VALUE lines and passes them to
  # compose, so the app gets its connection string without a temp file.
  - name: database
    up: |
      ./hooks/db-branch.sh recreate "$STACK" || exit 1
      echo "DATABASE_URL=$(./hooks/db-branch.sh url "$STACK")"
    assert_live: ./hooks/db-branch.sh exists "$STACK"
    down: ./hooks/db-branch.sh delete "$STACK"
    # Exit 0 ⇒ gone. Two things to get right: (a) fail closed if the API is unreachable, and
    # (b) branch names are usually NOT unique, so assert that NONE remain, not "the first is gone".
    assert_gone: |
      ./hooks/db-branch.sh ping || exit 1        # can't reach the API ⇒ cannot prove gone
      [ "$(./hooks/db-branch.sh count "$STACK")" = "0" ]

  # ── 2. Workflow namespace ───────────────────────────────────────────────────────────────
  # One shared Temporal cluster, isolated per PR by namespace — because task-queue names are
  # compiled into the app and cannot be overridden per deploy. A cluster per PR would cost
  # 1–2 GB RAM each.
  - name: queue-namespace
    up: |
      docker exec shared-temporal-1 temporal operator namespace create \
        --namespace "$STACK" --retention 24h 2>/dev/null || true
    assert_live: |
      docker exec shared-temporal-1 temporal operator namespace describe --namespace "$STACK" >/dev/null
    down: |
      docker exec shared-temporal-1 temporal operator namespace delete \
        --namespace "$STACK" --yes 2>/dev/null || true
    assert_gone: |
      docker info >/dev/null 2>&1 || exit 1                                  # no daemon ⇒ can't tell
      docker exec shared-temporal-1 temporal operator namespace list >/dev/null 2>&1 || exit 1
      ! docker exec shared-temporal-1 temporal operator namespace describe \
          --namespace "$STACK" >/dev/null 2>&1

  # ── 3. Images ───────────────────────────────────────────────────────────────────────────
  # `compose down -v` removes containers, volumes and networks but NEVER images, so per-PR image
  # layers accumulate until the disk fills — and disk pressure evicts the warm build cache, which
  # is the real per-PR speed lever. This axis is the cleanup compose won't do for you.
  - name: images
    down: |
      IMAGES=$(docker ps -a --filter "label=com.docker.compose.project=$STACK" \
                 --format '{{.Image}}' | sort -u)
      for img in $IMAGES; do docker rmi "$img" 2>/dev/null || true; done
    assert_gone: |
      docker info >/dev/null 2>&1 || exit 1                                  # no daemon ⇒ can't tell
      ! docker images --format '{{.Repository}}:{{.Tag}}' | grep -q ":${IMAGE_TAG}\$"

  # ── 4. Ingress / DNS ────────────────────────────────────────────────────────────────────
  # No `up`: routing is declared by Traefik labels on the compose services, and TLS comes from a
  # pre-issued wildcard cert, so there is nothing per-PR to create. The axis exists purely to
  # ASSERT the hostname stops resolving to a live backend after teardown — the check that catches
  # a router left registered by a half-removed container.
  - name: ingress
    assert_gone: |
      # Prove the CHECK works before trusting its negative: the shared host must still answer, or a
      # DNS/network outage would read as "every preview is cleaned up".
      curl -sf --max-time 5 "https://${PREVIEW_DOMAIN}/" >/dev/null || exit 1
      ! curl -sf --max-time 5 "https://backend-${STACK}.${PREVIEW_DOMAIN}/health" >/dev/null
