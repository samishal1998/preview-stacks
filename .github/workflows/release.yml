# Release: a `v*` tag → the Go binaries on GitHub Releases (GoReleaser), then the two npm packages
# (the UI and the client SDK) via publish-kit. The tag is the one version everything is asserted
# against: packages/pstack/package.json, apps/ui, packages/client and the binary's own --version.
#
# `verify` rehearses what the release will claim: the Go suite under -race, the UI/client checks,
# the lockstep assertion, and an image smoke test that builds the root Dockerfile and waits for the
# container's HEALTHCHECK to say `healthy` — the exact verdict `pstack init` blocks on.
name: Release

on:
  push:
    tags: ['v*']
  # Re-publish the npm half for a tag whose binaries already went out. `release` cannot simply be
  # re-run — GoReleaser refuses an existing release — and moving a tag to retry the last job is a
  # bad trade. Dispatch it AT THE TAG so the packages come from the released tree:
  #   gh workflow run release.yml --ref v0.29.0 -f npm_only=true
  workflow_dispatch:
    inputs:
      npm_only:
        description: 'Publish the npm packages only, for the tag this is dispatched at'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !inputs.npm_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      - name: Lockstep — the tag is the version everywhere
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in packages/pstack/package.json apps/ui/package.json packages/client/package.json; do
            v="$(jq -r .version "$f")"
            [ "$v" = "$tag" ] || { echo "$f is $v, tag is $tag"; exit 1; }
          done

      - name: Go — vet, race
        run: |
          go vet ./...
          go test -race -timeout 120s ./...

      - name: UI and client — test, typecheck, build
        run: bunx turbo run test typecheck build --filter=@samyx/preview-stacks-ui --filter=@samyx/preview-stacks-client

      - name: Conformance — the binary passes the black-box suite
        run: |
          go build -o packages/pstack/bin/pstack ./packages/pstack/cmd/pstack
          cd packages/conformance && bun run ratchet

      - name: Image smoke — builds and becomes healthy
        run: |
          docker build -t pstack:ci .
          docker run -d --name pstack-ci -e PSTACK_TOKEN=ci -e PSTACK_HOST=0.0.0.0 pstack:ci
          for i in $(seq 1 30); do
            s="$(docker inspect -f '{{.State.Health.Status}}' pstack-ci)"
            [ "$s" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' pstack-ci | grep -qx healthy || { docker logs pstack-ci; exit 1; }
          docker exec pstack-ci pstack --version | grep -qx "${GITHUB_REF_NAME#v}"

  release:
    needs: verify
    if: ${{ !inputs.npm_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The published installer, against the published release: what an operator will run.
      - name: Installer smoke
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$v/install.sh" | PSTACK_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          "$RUNNER_TEMP/bin/pstack" --version | grep -qx "$v"

  npm:
    needs: release
    # `always()` so the dispatch path reaches this with `release` skipped; the explicit result check
    # keeps a FAILED release from publishing packages anyway.
    if: ${{ always() && (needs.release.result == 'success' || inputs.npm_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # On the JOB, not the step: this is the one mechanism `bun publish` honours no matter which
    # directory publish-kit runs it from (see the table below), so it must be in scope for anything
    # the job spawns.
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # publish-kit shells out to `bun publish`, whose auth resolution was MEASURED against a local
      # registry on bun 1.3.12 rather than guessed — two releases failed to guesses:
      #
      #   NPM_CONFIG_TOKEN in the environment ............ authenticates
      #   .npmrc in $HOME, if it also declares registry= . authenticates
      #   .npmrc beside the package ...................... authenticates
      #   .npmrc at the workspace root ................... IGNORED — bun does not search upward
      #   NPM_CONFIG_TOKEN set but empty ................. hard-fails, never publishes anonymously
      #
      # publish-kit runs `bun publish` once per package, from that package's directory, so a
      # workspace-root .npmrc — which an earlier fix here added — is invisible to it. There is no
      # `bun publish --token`, and `--registry` overrides file auth, so the environment variable is
      # the only mechanism that does not depend on where the child happens to run. It is set on the
      # JOB so it reaches the child however publish-kit spawns it.
      #
      # The guard is first because the failure it prevents is expensive: this job runs AFTER the
      # binaries are public, so an empty or unset secret should stop here with a sentence saying so
      # rather than surfacing as a confusing auth error at the end of a pack.
      - name: Check the npm token is present
        run: |
          if [ -z "${NPM_CONFIG_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is empty or unset. Set it with: gh secret set NPM_TOKEN" >&2
            exit 1
          fi
      # --missing-only skips a package already on the registry. It is not tidiness: when 0.30.0's
      # packages were published by hand before the tag run, this job tried to publish them again,
      # `bun publish` fell back to INTERACTIVE web auth, printed a browser URL into the log, hung
      # for five minutes and then failed with "does not exist in this registry" — for two packages
      # that were both sitting there. A re-publish is also exactly what a retry of a partly-failed
      # run does, which is the case this flag was named for.
      - name: Publish the UI and the client SDK
        run: bunx publish-kit publish --missing-only
