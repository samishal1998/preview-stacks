# CI for pstack.
#
# Deliberately small — this repo ships a guide about CI patterns, so its own CI should be a
# legible example rather than a showcase. One job, no matrix.
#
# Two kinds of test run here. `turbo run test` is each package's own suite. packages/conformance is
# the BLACK-BOX specification: it spawns the real `pstack` and grades whichever implementation
# PSTACK_IMPL names, so the same tests grade the TypeScript reference today and the Go port as it
# lands (docs/port-status.md). Its three extra gates are what make those tests trustworthy: vacuity
# (every test must fail against a server that answers 200 {} to everything), golden freshness (the
# checked-in transcripts still match the reference), and the self-diff (the differential masks are
# tight enough that bun-vs-bun is identical).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on a PR, but never on main — a main run is the record for that commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned from a committed file so CI and local agree; bumping the runtime is a commit.
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # Turbo fans these out across the workspace and caches per package, so adding a package
      # needs no CI change.
      - name: Test
        run: bunx turbo run test

      - name: Typecheck
        run: bunx turbo run typecheck

      # The spec's own linting must hold for the shipped example, or the guide teaches a spec that
      # its own tool would warn about.
      - name: Validate the example spec
        # Now a byte-diff against the checked-in transcript (golden/cli/validate-example.json).
        run: cd packages/conformance && PSTACK_IMPL=bun bun test test/cli-goldens.test.ts -t validate-example

      # Every conformance test must FAIL against a server that asserts nothing.
      - name: Conformance — vacuity
        run: cd packages/conformance && bun run vacuity

      # The goldens are generated from the reference; a change to the reference must regenerate them.
      # (The host fixture and the argon2 facts carry random salts and live timestamps, so they are
      # regenerated deliberately, never compared.)
      - name: Conformance — golden freshness
        run: |
          cd packages/conformance
          bun gen/goldens.ts && bun gen/facts.ts
          git diff --exit-code -- golden/cli golden/render golden/facts ':!golden/facts/argon2.json'

      # The differential masks are the only place "allowed to differ" lives; bun-vs-bun must be empty.
      - name: Conformance — self-diff
        run: cd packages/conformance && bun run diff -- --self

      # The published artifact is a BUNDLE, so build it here: a broken bundle (a bad text import, a
      # dropped asset) is invisible to `bun test`, which runs the sources.
      - name: Build
        run: bunx turbo run build

      # Catch a broken `files`/`exports`/`bin` map before a release does — the failure mode is a
      # published package whose documented entry points throw "Cannot find module".
      #
      # NOT `publish-kit publish --dry-run`: `bun publish` demands registry auth even in dry-run
      # mode, and handing CI a publish token merely to rehearse a publish is a supply-chain risk
      # for no benefit. `bun pm pack` needs no credentials and asserts the same invariant.
      - name: Package entry points are shipped
        run: cd packages/pstack && bun scripts/check-package.ts
