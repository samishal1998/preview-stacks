# CI for pstack.
#
# Deliberately small — this repo ships a guide about CI patterns, so its own CI should be a
# legible example rather than a showcase. One job, no matrix.
#
# Two kinds of test run here. `turbo run test` is each package's own suite (Go under -race for
# pstack, bun for the UI and the client). packages/conformance is the BLACK-BOX specification: it
# spawns the real `pstack` binary and grades it against checked-in transcripts. Its extra gates are
# what make those tests trustworthy: vacuity (every test must fail against a server that answers
# 200 {} to everything), the ratchet (pass counts only go up), and the self-diff (the differential
# masks are tight enough that the same binary twice is identical).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on a PR, but never on main — a main run is the record for that commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned from a committed file so CI and local agree; bumping the runtime is a commit.
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # The Go suite first and on its own: -race is what makes the concurrency claims checkable.
      - name: Go — vet, race
        run: |
          go vet ./...
          go test -race -timeout 120s ./...

      # Turbo fans these out across the workspace and caches per package, so adding a package
      # needs no CI change. packages/pstack's scripts run both runtimes (bun test + go test).
      - name: Test
        run: bunx turbo run test

      - name: Typecheck
        run: bunx turbo run typecheck

      # The Go binary the conformance suite grades in go mode.
      - name: Build the Go binary
        run: go build -o packages/pstack/bin/pstack ./packages/pstack/cmd/pstack

      # The spec's own linting must hold for the shipped example, or the guide teaches a spec that
      # its own tool would warn about. A byte-diff against the checked-in transcript.
      - name: Validate the example spec
        run: cd packages/conformance && bun test test/cli-goldens.test.ts -t validate-example

      # Pass counts only go up (expected-pass.json), per file.
      - name: Conformance — ratchet
        run: cd packages/conformance && bun run ratchet

      # Every conformance test must FAIL against a server that asserts nothing.
      - name: Conformance — vacuity
        run: cd packages/conformance && bun run vacuity

      # The differential masks are the only place "allowed to differ" lives; the same binary twice
      # must be empty.
      - name: Conformance — self-diff
        run: cd packages/conformance && bun run diff -- --self

      - name: Installer is POSIX
        run: shellcheck install.sh

      # The UI and the client publish BUNDLES, so build them here: a broken bundle (a dropped asset)
      # is invisible to `bun test`, which runs the sources. The Go binary was built above.
      - name: Build
        run: bunx turbo run build

      # The control image from a checkout builds and reports its version — the contributor's path,
      # and the same runtime layer `pstack build-image` generates on a host.
      - name: Image builds
        run: docker build -t pstack:ci . && docker run --rm pstack:ci pstack --version
