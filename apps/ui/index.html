<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- An operations console for one host. Nothing here should ever be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Matches --bg per scheme, so the browser chrome (tab bar, overscroll) agrees with the page. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f8" />
    <meta name="description" content="pstack — the operations console for one preview host: deployments, jobs, routing and the control stack." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230e1116'/%3E%3Crect%20x='7'%20y='7'%20width='18'%20height='4.6'%20rx='2.3'%20fill='%234a9dff'/%3E%3Crect%20x='7'%20y='13.7'%20width='18'%20height='4.6'%20rx='2.3'%20fill='%237c8798'/%3E%3Crect%20x='7'%20y='20.4'%20width='18'%20height='4.6'%20rx='2.3'%20fill='%2349525f'/%3E%3C/svg%3E">
    <title>pstack</title>
    <script>
      /**
       * Theme, applied BEFORE first paint.
       *
       * The stylesheet defaults to the OS preference; a manual choice is stamped on <html> as
       * data-theme. Doing it here rather than in the app avoids the flash of the wrong theme
       * while Vue boots. Same for the motion override: a page that animates in before the
       * "reduce motion" setting loads has already broken the promise.
       */
      try {
        var t = localStorage.getItem('pstack.ui.theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        var m = localStorage.getItem('pstack.ui.motion');
        if (m === 'none' || m === 'full') document.documentElement.dataset.motion = m;
      } catch (e) {
        /* private mode: fall through to the OS preference */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
