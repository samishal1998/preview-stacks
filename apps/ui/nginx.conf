# nginx for the advanced UI container.
#
# Two jobs, and the second is the reason this file exists at all.

# ── WebSocket upgrade, without breaking upstream keep-alive ────────────────────────────────────
# The container terminal is a WebSocket. A proxy that does not forward `Upgrade`/`Connection` turns
# the handshake into an ordinary GET, and the browser reports a bare code-1006 close that looks like
# the server refusing it — the failure is invisible from the client side.
#
# But the proxy block below deliberately sends `Connection ""` so nginx can keep the upstream
# connection alive for the SSE job log. Both are needed, so the value is chosen PER REQUEST: empty
# for normal traffic (keep-alive preserved), `upgrade` only when the client asked for one. `map`
# belongs to the http block — this file is included inside it.
map $http_upgrade $pstack_connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Never cache the entry document. Vite fingerprints every asset, so a stale index.html is the one
  # way a browser can end up asking for a chunk that no longer exists after an upgrade.
  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Fingerprinted assets are immutable by construction — a change produces a new filename.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ── The proxy — why this container is not just a static bucket ─────────────────────────────
  # The SPA calls the API with RELATIVE paths (`/api/…`), so proxying here keeps the browser
  # same-origin: no CORS preflight to configure, no cross-origin cookie rules, and nothing to change
  # if the hostnames move. `pstack` is the control-stack service name, resolved on the shared
  # ingress network.
  #
  # `proxy_buffering off` is load-bearing for the job log: the API streams Server-Sent Events, and
  # with buffering on nginx would hold the response until a buffer filled — the log would appear to
  # freeze and then arrive in bursts, which reads exactly like a hung job.
  location /api/ {
    proxy_pass http://pstack:7878;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pstack_connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    # A job can outlive any sane request timeout; the SSE stream must not be cut mid-run.
    proxy_read_timeout 1h;
  }

  # SPA fallback, LAST so it never shadows a real file or the proxy above. Without it every deep
  # link (/deployments/pr-7, /jobs/xyz) 404s on reload — the router only exists once the app has
  # loaded, and it cannot load if the server refuses the URL.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
