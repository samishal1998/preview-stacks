# The pstack CONTROL stack — Traefik (ingress + one wildcard certificate) and pstack (HTTP API
# and web UI, one container: the API already serves the UI).
#
# `pstack init` copies this file to ${PSTACK_DATA}/control/docker-compose.yml byte for byte,
# writes the `.env` beside it that every ${PLACEHOLDER} below reads, and brings it up FROM THE
# HOST:
#
#     docker compose -p pstack-control -f docker-compose.yml up -d
#
# ── THE RULE THIS FILE EXISTS TO ENFORCE ─────────────────────────────────────────────────────
# The pstack container below manages every shared and isolated deployment on this host. It never
# manages THIS stack. `up` on this project recreates the pstack container, killing the process
# performing the operation mid-flight; if the new image is broken, the only thing that could have
# repaired the host just died with it. Upgrades therefore run from the host (`pstack init` /
# `pstack self-upgrade`) — which is also why this file lives next to the registry instead of being
# submitted to it as a deployment.
# ─────────────────────────────────────────────────────────────────────────────────────────────

# Pins the project name so volume names are deterministic (`pstack-control_letsencrypt`) rather
# than derived from whatever directory the file happens to sit in.
name: pstack-control

services:
  # ═══ Traefik ══════════════════════════════════════════════════════════════════════════════
  # Owns :80 and :443 for the whole host. Two providers, because they answer different questions:
  #   docker — turns per-deployment container labels into routes, with no restart and no config
  #            file. This is what makes a new preview hostname free.
  #   file   — holds what no container owns (middlewares, static routes you add by hand).
  traefik:
    # Pin ≥ v3.6.1: earlier 3.x releases cannot talk to Docker Engine 29's API, and the docker
    # provider then comes up empty — every route 404s while Traefik itself looks perfectly healthy.
    image: traefik:v3.6.1
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    networks: [preview-ingress]
    # The DNS-01 credential. A separate file because Compose cannot build an environment KEY from a
    # variable, and every lego provider names its token differently (CF_DNS_API_TOKEN,
    # HETZNER_API_TOKEN, …). `pstack init` writes it, mode 0600.
    env_file:
      - ./dns.env
    volumes:
      # READ-ONLY, and deliberately different from pstack's mount below. Traefik only needs to
      # enumerate containers, labels and networks. `:ro` stops accidents, not an attacker — the
      # read-only Docker API still exposes every container's environment — so consider a socket
      # proxy that whitelists just the endpoints Traefik uses (docs/bootstrap.md §9).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # acme.json lives here. BACK IT UP: losing it means re-issuing, and re-issuing into a
      # rate limit at the wrong moment means no TLS at all for hours.
      - letsencrypt:/letsencrypt
      # The file provider's watched directory. NOTHING but dynamic config may live in it — drop an
      # htpasswd file in here and Traefik tries to parse `admin:$apr1$…` as config, logs a parse
      # error, and can discard the rest of the directory with it. The visible symptom is a missing
      # certificate, which points you at ACME instead of at a misplaced file.
      - ./traefik-dynamic:/etc/traefik/dynamic:ro
    command:
      # ── providers ──
      - --providers.docker=true
      # Opt-in routing. Without this, every service of every deployment — including internal ones —
      # gets a public route derived from its container name.
      - --providers.docker.exposedbydefault=false
      # Which of a container's networks Traefik should dial. A preview service typically sits on
      # preview-ingress, preview-shared AND its own project default; without this Traefik may pick
      # one it cannot reach and you get a 502 that looks like an app bug.
      - --providers.docker.network=preview-ingress
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # ── entrypoints: all plaintext redirected to TLS ──
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # ── ACME over DNS-01 ──
      # DNS-01, not HTTP-01, for two reasons: a wildcard can ONLY be issued via DNS-01, and
      # HTTP-01 would need a container already answering on the hostname being certified — so a
      # PR mid-build would serve a TLS error that looks like a certificate problem but is a
      # sequencing problem. DNS-01 needs nothing running.
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=${DNS_PROVIDER}
      # Ask a public resolver during the precheck instead of the host's, which may serve stale or
      # split-horizon answers and stall the challenge until it times out.
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53
      # Wait for the zone to converge before telling the CA to look. Raise it (120s) on a slow zone.
      - --certificatesresolvers.le.acme.dnschallenge.propagation.delaybeforechecks=30s
      - --log.level=INFO
      - --accesslog=true

  # ═══ pstack: the control plane itself ═════════════════════════════════════════════════════
  # Serves the API and the UI. Manages shared and isolated deployments — and NOT this stack; see
  # the header.
  pstack:
    image: ${PSTACK_IMAGE}
    restart: unless-stopped
    mem_limit: 512m
    networks: [preview-ingress, preview-shared]
    # Overrides the image's non-root default, on purpose. The socket below is mounted read-write,
    # which is root-equivalent on this host no matter which uid holds it — so a non-root container
    # user buys no boundary here, while costing two real failure modes: the socket's group id
    # differs per distro, and files written into the bind-mounted registry would be owned by a uid
    # that does not exist on the host. If you remove this line, you must solve both.
    user: "0:0"
    volumes:
      # READ-WRITE, unlike Traefik's. pstack works by shelling out to `docker compose`; it must be
      # able to create and destroy containers, networks and volumes. This is the whole reason
      # PSTACK_TOKEN matters: anyone who can drive this API can start a privileged container and
      # own the box. Never expose it without the token, and never publish the socket over TCP.
      - /var/run/docker.sock:/var/run/docker.sock
      # Only the registry, not all of ${DATA_DIR}: the DNS provider token in ./dns.env is Traefik's
      # business, and the API has no reason to be able to read it.
      - ${DATA_DIR}/deployments:/data/deployments
    environment:
      # Bearer token for mutating routes. Note GETs are NOT gated — /api/jobs/:id returns full hook
      # transcripts — so the ingress in front of this is the only protection on reads.
      PSTACK_TOKEN: ${PSTACK_TOKEN}
      # Registry root. The Registry appends `deployments/` itself, which is why the mount above
      # lands at /data/deployments.
      PSTACK_DATA: /data
      # Safe here and ONLY here: the container is on a private bridge, reachable from Traefik, and
      # publishes no host port. `serve` refuses a non-loopback bind without PSTACK_TOKEN anyway.
      PSTACK_HOST: 0.0.0.0
      PSTACK_PORT: "7878"
    labels:
      - traefik.enable=true
      - traefik.docker.network=preview-ingress
      - traefik.http.routers.pstack.rule=Host(`pstack.${DOMAIN}`)
      - traefik.http.routers.pstack.entrypoints=websecure
      - traefik.http.services.pstack.loadbalancer.server.port=7878
      # ── THE ONE ROUTER THAT REQUESTS THE WILDCARD ────────────────────────────────────────────
      # `certresolver` on a router makes Traefik request a certificate for THAT router's domains.
      # Exactly one always-on router asks for the wildcard here; every other router on this host —
      # every per-PR service — sets `tls=true` and NOTHING else, inheriting this certificate by
      # SNI. Add `certresolver` to a per-PR router and each PR triggers its own issuance, which is
      # how you meet Let's Encrypt's rate limits and end up with no TLS for a week.
      - traefik.http.routers.pstack.tls=true
      - traefik.http.routers.pstack.tls.certresolver=le
      - traefik.http.routers.pstack.tls.domains[0].main=${DOMAIN}
      - traefik.http.routers.pstack.tls.domains[0].sans=*.${DOMAIN}
      # Note the wildcard matches ONE label: `backend-pr-123.${DOMAIN}` is covered,
      # `backend.pr-123.${DOMAIN}` is not. Flatten per-PR hostnames with dashes.

volumes:
  letsencrypt:

networks:
  # Declared `external` here AND in every per-PR compose file, because `pstack init` creates them.
  # Declare one non-external on the per-PR side and Compose makes a *different* network named
  # `pr-123_preview-ingress`: the container is up, healthy, and unreachable, and Traefik answers
  # 404 for a hostname that looks correctly configured.
  preview-ingress:
    external: true
  preview-shared:
    external: true
