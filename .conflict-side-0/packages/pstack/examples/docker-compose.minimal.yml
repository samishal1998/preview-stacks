# docker-compose.minimal.yml — the same two services as docker-compose.preview.yml, with pstack
# generating the Traefik labels and the network wiring.
#
#   PR=123 PREVIEW_DOMAIN=preview.example.com pstack -f examples/preview.yml up
#
# ── WHAT YOU DECLARE ─────────────────────────────────────────────────────────────────────────
#
#   pstack.routing.port           REQUIRED to be routed. The port INSIDE the container. Traefik
#                                 resolves the container's IP on preview-ingress and dials this on
#                                 it, so no `ports:` publishing is involved at all.
#   pstack.routing.service_name   optional. The hostname and router id become
#                                 `<name>-<stack>`; defaults to the compose service name.
#   pstack.routing.host           optional. A complete hostname, when the convention does not fit.
#
# ── WHAT PSTACK GENERATES ────────────────────────────────────────────────────────────────────
#
# Into a DERIVED file (`compose.generated.yml`) written beside this one — this file is never
# modified, and `pstack validate` prints what was generated:
#
#   traefik.enable=true                          the host runs exposedbydefault=false, so a
#                                                container without this is invisible to Traefik
#   traefik.docker.network=preview-ingress       which network to dial
#   …routers.<name>-<stack>.rule=Host(`…`)       the hostname
#   …routers.<name>-<stack>.entrypoints/tls      plus tls.certresolver=le on an HTTP-01 host and
#                                                NOT on a DNS-01 one — read from the running
#                                                Traefik, so it cannot disagree with the host
#   …services.<name>-<stack>.loadbalancer.server.port
#   networks: [default, preview-ingress]         on the service, appended to whatever you wrote
#   networks: {default, preview-ingress: {external: true}, preview-shared: {external: true}}
#
# The stack is in every router and service id because Traefik's namespace is GLOBAL across the
# daemon: two deployments sharing a router name overwrite each other, and one hostname starts
# serving the other's container.
#
# ── THE ESCAPE HATCH ─────────────────────────────────────────────────────────────────────────
#
# A service carrying ANY `traefik.*` label of its own is left completely alone — labels, networks
# and all. Write your own the moment you need something this cannot express (a middleware chain,
# two routers on one service) and pstack stops having an opinion. See
# docker-compose.preview.yml for the full hand-written form.
#
# Still yours, because they are decisions and not boilerplate: `profiles:` on every service (a
# bare `up` must start nothing), an `${X_IMAGE:-unset}` default so a forgotten variable fails
# obviously, `mem_limit` (there is no memory isolation between stacks), and a healthcheck so
# Traefik only routes a ready container.
# ─────────────────────────────────────────────────────────────────────────────────────────────

services:
  api:
    image: ${BACKEND_IMAGE:-unset}
    profiles: [backend]
    restart: unless-stopped
    mem_limit: 1g
    environment:
      DATABASE_URL: ${DATABASE_URL:?the database axis must run before compose}
      PORT: "3000"
    labels:
      # `backend-${STACK}.${DOMAIN}` → this container on port 3000.
      - pstack.routing.port=3000
      - pstack.routing.service_name=backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 60s

  frontend:
    image: ${FRONTEND_IMAGE:-unset}
    profiles: [frontend]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    labels:
      # No service_name, so the hostname is `frontend-${STACK}.${DOMAIN}`.
      - pstack.routing.port=3000

  # Not routed, and correctly so: no pstack.routing.* label means no hostname, no ingress
  # attachment, and no Traefik labels. A database should not be reachable from the internet.
  postgres:
    image: postgres:17
    profiles: [backend]
    mem_limit: 512m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password}
