# shared.yml — the ALWAYS-ON stack (ingress + any shared services).
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# THE TWO-FILE MODEL — read this if you are wondering "where is the shared stack declared?"
#
# A host runs exactly TWO kinds of stack, and they have opposite lifecycles:
#
#   shared.yml   ONE per host.  Created once at bootstrap, lives forever, upgraded rarely.
#                Traefik, Portainer, a shared queue/DB — whatever every preview borrows.
#                NO axes: there is nothing per-PR to provision and nothing to prove gone.
#
#   preview.yml  ONE per PR.    Created and destroyed constantly. Has axes, because each PR needs
#                its own database branch / namespace / images, and each must be proven gone.
#
# By default `docs/bootstrap.md` brings this file up from **cloud-init**, not from pstack:
#
#     docker compose -f /opt/preview/shared/docker-compose.yml up -d
#
# That is deliberate — the host must be able to boot and serve without pstack running. But the
# file below shows you can ALSO drive it with pstack (`pstack -f shared.yml up`), which is handy
# for a reproducible upgrade: same tool, same dry-run, same report.
#
# ⚠️  NEVER RUN `pstack -f shared.yml down`.
#     `down` runs `docker compose down -v`, and `-v` removes VOLUMES. On this stack that means:
#       · letsencrypt/acme.json → every TLS certificate for the host, re-issued from scratch
#         (and Let's Encrypt rate limits are per-week, so you may be down for days)
#       · the shared database/queue volume → every preview's state
#       · portainer-data → your admin credentials
#     The same verb that is routine for a PR is catastrophic here. Upgrade with an explicit
#     `docker compose ... up -d` instead, or `pstack -f shared.yml up` (which never removes).
# ─────────────────────────────────────────────────────────────────────────────────────────────

version: 1

# A fixed identity, not a template — there is only ever one of these per host. It becomes the
# compose project name, so keep it stable: the per-PR specs reference container names derived
# from it (e.g. `shared-temporal-1`), and renaming it silently breaks every preview's hooks.
stack: shared

env:
  PREVIEW_DOMAIN: preview.example.com
  ACME_EMAIL: ops@example.com

compose:
  file: docker-compose.shared.yml
  # No profiles: everything in the shared stack is always on. (Contrast preview.yml, where every
  # service is profiled so a bare `up` starts nothing.)
  profiles: []

# No axes.
#
# Axes exist to isolate one tenant from another and to prove a tenant's resources were cleaned
# up. A singleton has neither problem: there is nothing to namespace, and you never want to
# assert it is gone. If you find yourself adding an axis here, it probably belongs in preview.yml.
axes: []
